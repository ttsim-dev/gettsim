---
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      # - id: identity  # Prints all files passed to pre-commits. Debugging.
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.29.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-jsonschema
        name: Validate JSON/YAML files against schema
        entry: check-jsonschema
        language: python
        files: ^src/gettsim/germany/.*\.(yaml|yml)$
        args:
          - --schemafile=docs/geps/params-schema.json
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=10000
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
        types:
          - text
      - id: mixed-line-ending
        args:
          - --fix=lf
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: no-commit-to-branch
        args:
          - --branch
          - main
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args:
          - --fix
        types_or:
          - jupyter
          - pyi
          - python
      - id: ruff-format
        types_or:
          - jupyter
          - pyi
          - python
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.83
    hooks:
      - id: ty
        name: ty (numpy backend)
        # Run ty directly so import resolution uses `[tool.ty] environment.python`.
        # Keep this dependency pin aligned with the hook revision above.
        entry: ty check
        additional_dependencies:
          - ty==0.0.83
  - repo: local
    hooks:
      - id: ty-jax
        name: ty (jax backend)
        # A separate hook because it checks against a second environment, the
        # JAX one. Keep the ty pin in sync with the `ty-pre-commit` rev above.
        language: python
        additional_dependencies:
          - ty==0.0.83
        entry: ty check --python .pixi/envs/py314-jax
        pass_filenames: false
        always_run: true
        require_serial: true
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - --extra-keys
          - metadata.kernelspec metadata.language_info.version metadata.vscode
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
        args:
          - --wrap
          - '88'
        files: (AGENTS\.md|CLAUDE\.md|README\.md|CHANGES\.md|CODE_OF_CONDUCT\.md|modules/.*\.md|profiles/.*\.md)
      - id: mdformat
        additional_dependencies:
          - mdformat-myst
          - mdformat-ruff
        args:
          - --wrap
          - '88'
        files: docs/.
  - repo: local
    hooks:
      - id: notebook-cell-source-format
        name: notebook cell source is a JSON array of lines
        entry: .ai-instructions/hooks/fix_notebook_cell_source.py
        language: script
        types:
          - jupyter
      - id: no-hardcoded-user-paths
        name: no hardcoded user-specific absolute paths
        language: pygrep
        entry: (/home/[A-Za-z0-9_.-]+/|/Users/[A-Za-z0-9_.-]+/|[A-Za-z]:\\Users\\)
        types_or:
          - python
          - toml
      - id: no-section-separator-comments
        name: no decorative section-separator comments
        language: pygrep
        entry: ^\s*#\s*[-=#_*]{10,}\s*$
        types:
          - python
      # Catches the labelled forms only — PR/issue numbers, `E<n>`/`F<n>`
      # finding labels, `round-<n>`, `pre-fix`. Prose that rehearses history
      # without a label stays a review responsibility.
      - id: no-internal-references
        name: no references a reader cannot reach from the checkout
        language: pygrep
        entry: (?:^|[\s(\[])\#[0-9]{2,5}\b(?!\.[0-9])|(?i:\b(?:round|wave)-[0-9]+\b)|(?i:\b(?:audit|review|finding|witness|defect|bug|fix|guard)\s+)(?:finding\s+)?[EF][0-9]{1,2}\b|\b[EF][0-9]{1,2}(?i:\s+(?:fix|guard|bug|defect|witness|signature|regression|finding|audit)\b)|(?:^|\s)\((?:the\s+)?(?!(?:F8|F16|F32|F64)\b)[EF][0-9]{1,2}['’]?(?:\s*[,/]\s*[EF][0-9]{1,2}['’]?)*(?:[,)\s])|(?i:\b(?:pre|post)-fix\b)
        types:
          - python
ci:
  autoupdate_schedule: monthly
  # pre-commit.ci has no pixi environments and blocks network at hook runtime;
  # the GitHub Actions `run-ty` job covers type checking.
  #
  # `notebook-cell-source-format` runs a file from the `.ai-instructions`
  # submodule, which pre-commit.ci does not clone, so the check holds only where
  # the submodule is present.
  skip:
    - ty
    - ty-jax
    - notebook-cell-source-format
