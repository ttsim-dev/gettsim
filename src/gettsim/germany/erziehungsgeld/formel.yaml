abschlagsfaktor:
  name:
    de: Abschlagsfaktor
    en: Deduction factor
  description:
    de: >-
      Faktor zur Berechnung des Abschlags des Erziehungsgeldes bei einer
      Überschreitung der Einkommensgrenze ab dem 7 Lebensmonat.
      Der Faktor wird mit dem relevanten Einkommen multipliziert und
      das Produkt entsprechend vom Erziehungsgeld Anspruch abgezogen
    en: >-
      Factor for calculating the reduction of the parental leave benefit in case of
      exceeding the income threshold after the 7th month of life.
      The factor is multiplied by the relevant income and
      the product is deducted from the parental leave benefit entitlement accordingly.
  unit: DIMENSIONLESS
  type: scalar
  2004-01-01:
    reference: § 5 Abs. 4 Satz 2 BErzGG idF Art. 20 G. v. 29.12.2003 BGBl. I S. 3076
    note: >-
      Haushaltsbegleitgesetz 2004. Bekanntmachung der Neufassung des BErzGG v.
      09.02.2004 BGBl. I S. 206.
      https://www.bgbl.de/xaver/bgbl/start.xav?startbk=Bundesanzeiger_BGBl&jumpTo=bgbl104s0206.pdf#__bgbl__%2F%2F*%5B%40attr_id%3D%27bgbl104s0206.pdf%27%5D__1685621730529
    value: 0.052
  2009-01-01:
    reference: >-
      none (BErzGG repealed with effect from 1 January 2009 by Art. 3 Abs. 2 G. v.
      05.12.2006 BGBl. I S. 2748; replaced by Elterngeld)
    note: Erziehungsgeld revoked and replaced by Elterngeld.
