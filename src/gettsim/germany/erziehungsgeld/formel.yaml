parameter_einkommensgrenze:
  name:
    de: Einkommensgrenze
    en: Income threshold
  description:
    de: >-
      Einkommensgrenze für den Erhalt von Erziehungsgeld bei jungen Kindern. Bei Kindern
      unter einer Altersgrenze, wird Erziehungsgeld nicht gezahlt, wenn das Einkommen
      der Eltern die Einkommensgrenze überschreitet.
    en: >-
      Income threshold for the receipt of parental leave benefit for young children.
      For children under a certain age, parental leave benefit is not paid if the
      income of the parents exceeds the income threshold.
  unit: EUR_PER_YEAR
  type: require_converter
  2004-01-01:
    reference:
      - § 5 Abs. 3 Satz 1 BErzGG idF Art. 20 G. v. 29.12.2003 BGBl. I S. 3076
      - § 5 Abs. 3 Satz 2 BErzGG idF Art. 20 G. v. 29.12.2003 BGBl. I S. 3076
      - § 5 Abs. 3 Satz 3 BErzGG idF Art. 20 G. v. 29.12.2003 BGBl. I S. 3076
    note: >-
      Haushaltsbegleitgesetz 2004. Bekanntmachung der Neufassung des BErzGG v.
      09.02.2004 BGBl. I S. 206. Reduced income limit for children older than 6 months.
      https://www.bgbl.de/xaver/bgbl/start.xav?startbk=Bundesanzeiger_BGBl&jumpTo=bgbl104s0206.pdf#__bgbl__%2F%2F*%5B%40attr_id%3D%27bgbl104s0206.pdf%27%5D__1685621730529
    regulär_alleinerziehend:
      regelsatz: 23000
      budgetsatz: 19086
    regulär_paar:
      regelsatz: 30000
      budgetsatz: 22086
    reduziert_alleinerziehend:
      regelsatz: 13500
      budgetsatz: 13500
    reduziert_paar:
      regelsatz: 16500
      budgetsatz: 16500
  2009-01-01:
    reference: >-
      none (BErzGG repealed with effect from 1 January 2009 by Art. 3 Abs. 2 G. v.
      05.12.2006 BGBl. I S. 2748; replaced by Elterngeld)
    note: Erziehungsgeld revoked and replaced by Elterngeld.
