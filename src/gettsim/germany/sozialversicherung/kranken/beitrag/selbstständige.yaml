mindestanteil_bezugsgröße_selbstständige:
  name:
    de: Mindestberechungsbeitrag für Selbstständige als Anteil der Bezugsgröße
    en: Minimum contribution for self employed as fraction of Bezugsgröße
  description:
    de: >-
      §240 SGB V Abs. 4
      Als beitragspflichtige Einnahmen gilt für den Kalendertag mindestens der
      neunzigste Teil der monatlichen Bezugsgröße (1/90*30)
    en: >-
      §240 SGB V Abs. 4
      Health Insurance contributions have to be paid, at the minimum, on the ninetieth
      part of the monthly Bezugsgröße for each calendar day
  unit: DIMENSIONLESS
  type: scalar
  1990-01-01:
    note: >-
      Gesundheits-Reformgesetz. Der neunzigste Teil der monatlichen Bezugsgröße je
      Kalendertag, also ein Drittel der monatlichen Bezugsgröße für 30 Tage. In Kraft
      seit 1989; GETTSIM bildet die Regel ab 1990 ab.
    value: 0.33333333
    reference: § 240 Abs. 4 Satz 1 SGB V idF Art. 1 G. v. 20.12.1988 BGBl. I S. 2477
