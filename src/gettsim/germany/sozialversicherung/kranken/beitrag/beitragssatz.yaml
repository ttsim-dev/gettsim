parameter_beitragssatz:
  name:
    de: Beitragssatz zur gesetzlichen Krankenversicherung mit Zusatzbeitrag
    en: Contribution rate to statutory health insurance with top-up contribution
  description:
    de: >-
      Beitragssätze für gesetzliche Krankenversicherung. mean_allgemein -
      durchschnittlicher Beitragssatz, bis 2008 allgemein - allgemeiner Satz (§241 SGB
      V), ab 2009 sonderbeitrag - bezahlt von Arbeitnehmern, ab Jul 2005 bis 2014
      ermäßigt - ermäßigter Satz (§243 SGB V) zusatz - durchschnittlicher
      Zusatzbeitragssatz.
    en: >-
      Statury Contribution Rates for mandatory health insurance. mean_allgemein -
      average contribution rate, 1992 to 2008 allgemein - general statutory
      contribution rate, since 2009 sonderbeitrag - paid by employees, Jul 2005 to
      2014 ermäßigt - reduced rate zusatz - average top-up contribution rate
  unit: DIMENSIONLESS
  type: dict
  add_jahresanfang: true
  2005-07-01:
    mean_allgemein: 0.133
    sonderbeitrag: 0.009
    note: >-
      Allgemeiner Beitragssatz wird nicht mehr gleichmäßig aufgeteilt, Einführung des
      Sonderbeitrags (Gesetz zur Anpassung der Finanzierung von Zahnersatz).
      mean_allgemein ist ein Durchschnitt der Beitragssätze der Krankenkassen.
    reference: § 241a Abs. 1 Satz 1 SGB V idF Art. 1 G. v. 15.12.2004 BGBl. I S. 3445
  2007-01-01:
