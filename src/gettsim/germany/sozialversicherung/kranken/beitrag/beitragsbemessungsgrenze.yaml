parameter_beitragsbemessungsgrenze_nach_wohnort:
  name:
    de: Beitragsbemessungsgrenze der gesetzlichen Krankenversicherung
    en: Maximum amount of income subject to health insurance contributions
  description:
    de: >-
      Die Beitragsbemessungsgrenze für Krankenversicherung ist unterschiedlich
      zwischen West- und Ostdeutschland. Die Bemessungsgrenze gilt auch für die
      Pflegeversicherung.
    en: >-
      The maximum amount of income subject to health insurance contributions differs
      between West and East Germany. It also applies to long-term care insurance.
  unit: EUR_PER_MONTH
  type: dict
  1990-01-01:
    unit: DM_PER_MONTH
    west: 4725
    ost: 2025
    reference: § 6 Abs. 7 SGB V; Anlage 2 SGB VI.
    note: >-
      Die Grenze beträgt drei Viertel der Beitragsbemessungsgrenze der
      Rentenversicherung, siehe ``sozialversicherung__rente__beitrag__
      parameter_beitragsbemessungsgrenze_nach_wohnort``.
