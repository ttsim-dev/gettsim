    unit: DM_PER_MONTH
    value: 3900
    reference: § 180 Abs. 1 Satz 3 RVO idF G. v. 27.06.1977 BGBl. I S. 1069
    note: >-
      Krankenversicherungs-Kostendämpfungsgesetz. 75 % der Beitragsbemessungsgrenze
      der Rentenversicherung.
