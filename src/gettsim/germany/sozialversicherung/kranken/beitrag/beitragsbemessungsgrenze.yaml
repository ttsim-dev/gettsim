  name:
    de: Beitragsbemessungsgrenze der gesetzlichen Krankenversicherung
    en: Maximum amount of income subject to health insurance contributions
  description:
    de: >-
      Die Beitragsbemessungsgrenze ist einheitlich in der gesamten BRD. Die
      Bemessungsgrenze gilt auch für die Pflegeversicherung.
