---
mindestlohn:
  name:
    de: Allgemeiner gesetzlicher Mindestlohn pro Stunde
    en: Statutory hourly minimum wage
  description:
    de: >-
      §1 (2) Mindestlohngesetz
      Der Mindestlohn ist der niedrigste Stundenlohn, den ein Arbeitgeber für eine
      regelmäßige, nicht mehr als 45 Stunden wöchentlich zu leistende Arbeitsleistung
      zahlen muss.
    en: >-
      §1 (2) Mindestlohngesetz
      The minimum wage is the lowest hourly wage that an employer must pay for a
      regular, not more than 45 hours weekly work.
  unit: EUR_PER_HOURS
  type: scalar
