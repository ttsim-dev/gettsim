---
anzurechnendes_einkommen_ohne_partner:
  name:
    de: Einkommensanrechnung Grundrente für Personen ohne verheiratetem Partner
    en: Crediting of income for basic pension for individuals without married partner
  description:
    de: >-
      § 97a Abs. 4 S. 2, 4 SGB VI
      Werte werden mit dem Rentenwert multipliziert, um Schwellen der
      Einkommensanrechnung des Grundrentenzuschlags zu ermitteln
    en: >-
      § 97a Abs. 4 S. 2, 4 SGB VI
      Values are multiplied with the Rentenwert to compute the thresholds of the income
      crediting rule of Grundrentenzuschlag
  unit: Share
  reference_period: null
  type: piecewise_linear
  2021-01-01:
    intervals:
      - interval: (-inf, 36.56)
        slope: 0
        intercept: 0
      - interval: '[36.56, 46.78)'
        slope: 0.6
      - interval: '[46.78, inf)'
        slope: 1
anzurechnendes_einkommen_mit_partner:
  name:
    de: Einkommensanrechnung Grundrente für Personen mit verheiratetem Partner
    en: Crediting of income for basic pension for individuals with married partner
  description:
    de: >-
      § 97a Abs. 4 S. 2, 4 SGB VI
      Werte werden mit dem Rentenwert multipliziert, um Schwellen der
      Einkommensanrechnung des Grundrentenzuschlags zu ermitteln
    en: >-
      § 97a Abs. 4 S. 2, 4 SGB VI
      Values are multiplied with the Rentenwert to compute the thresholds of the income
      crediting rule of Grundrentenzuschlag
  unit: Share
  reference_period: null
  type: piecewise_linear
  2021-01-01:
    intervals:
      - interval: (-inf, 57.03)
        slope: 0
        intercept: 0
      - interval: '[57.03, 67.27)'
        slope: 0.6
      - interval: '[67.27, inf)'
        slope: 1
