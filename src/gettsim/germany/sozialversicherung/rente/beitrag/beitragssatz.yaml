      - § 112 Abs. 1 AVG idF Art. 2 G. v. 25.07.1978 BGBl. I S. 1089
    note: >-
      Einundzwanzigstes Rentenanpassungsgesetz; 18,5 % seit dem 1. Januar 1981.
