    de: Allgemeiner Beitragssatz zur gesetzlichen Rentenversicherung
    en: Contribution rate to statutory pension insurance
  description:
    de: >-
      Beitragssatz zur gesetzlichen Rentenversicherung, wird hälftig von
      Arbeitnehmer/Arbeitgeber getragen.
    en: >-
      Contribution rate to statutory pension insurance, which is shared equally by
      employees and employers.
  unit: DIMENSIONLESS
  type: scalar
  add_jahresanfang: true
