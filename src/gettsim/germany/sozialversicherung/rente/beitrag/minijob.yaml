---
minijob_arbeitgeberpauschale:
  name:
    de: >-
      Pauschalbeitrag des Arbeitgebers zur Rentenversicherung bei geringfügiger
      Beschäftigung
    en: >-
      Fixed employer pension insurance contribution for marginal employment
  description:
    de: >-
      Pauschalbetrag zur Rentenversicherung (§ 168 I Nr. 1b SGB VI) bei geringfügiger
      Beschäftigung
    en: >-
      Fixed pension insurance contributions for marginal employment
      (§ 168 I Nr. 1b SGB VI)
  unit: DIMENSIONLESS
  type: scalar
  1999-04-01:
    value: 0.12
    reference: BGBl I 1999 S. 388
    note: Introduction of '630 Mark' jobs.
  2003-04-01:
    value: 0.12
    reference: Art. 1 G. v. 23.12.2002 BGBl. I S. 4621
    note: >-
      Seitdem gilt für geringfügige Beschäftigungen in Privathaushalten ein
      ermäßigter Pauschalbeitrag von 5% (§ 168 Abs. 1 Nr. 1c SGB VI). Dieser wird
      nicht modelliert, GETTSIM verwendet stets den gewerblichen Satz.
  2006-07-01:
    value: 0.15
    reference: G. v. 29.06.2006 BGBl. I S. 1402 (Haushaltsbegleitgesetz 2006)
mindestbeitragsbemessungsgrundlage_geringfügige_beschäftigung_m:
  name:
    de: >-
      Mindestbeitragsbemessungsgrundlage bei geringfügiger Beschäftigung
    en: >-
      Minimum income basis for pension contributions in marginal employment
  description:
    de: >-
      Untergrenze der beitragspflichtigen Einnahme bei geringfügiger Beschäftigung
      (§ 163 Abs. 8 SGB VI). Bis zum 31.12.2012 galt sie nur für Beschäftigte, die auf
      die Versicherungsfreiheit verzichtet haben, seit dem 01.01.2013 für alle
      geringfügig Beschäftigten.
    en: >-
      Lower bound on income subject to pension contributions in marginal employment
      (§ 163 Abs. 8 SGB VI). Until 2012-12-31 it applied only to employees who had
      waived their Versicherungsfreiheit, since 2013-01-01 to all marginally employed.
  type: scalar
  1999-04-01:
    value: 300
    unit: DM_PER_MONTH
    reference: Art. 4 Nr. 13 G. v. 24.03.1999 BGBl. I S. 388
    note: Introduction of '630 Mark' jobs.
  2002-01-01:
    value: 155
    unit: EUR_PER_MONTH
    reference: Art. 7 G. v. 21.12.2000 BGBl. I S. 1983
    note: >-
      Das Vierte Euro-Einführungsgesetz ersetzte die Angabe '300 Deutsche Mark' durch
      '155 Euro'. Der Betrag wurde glatt gestellt, nicht umgerechnet.
  2013-01-01:
    value: 175
    reference: Art. 4 G. v. 05.12.2012 BGBl. I S. 2474
