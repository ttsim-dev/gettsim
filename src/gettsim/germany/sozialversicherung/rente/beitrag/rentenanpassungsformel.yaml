alpha:
  name:
    de: Parameter alpha der Rentenanpassungsformel
    en: Parameter alpha of the pension adjustment formula
  description:
    de: >-
      §68 Abs. 4 S. 6 SGB VI
      Teil des Nachhaltigkeitsfaktors in der Rentenanpassungsformel, welche das
      Verhältnis von Rentnern zu Beitragszahlern modifiziert
    en: >-
      §68 Abs. 4 S. 6 SGB VI
      Part of the sustainability factor in the pension adjustment formula which modifies
      the ratio of pensioners to contributors
  unit: DIMENSIONLESS
  type: scalar
  2004-08-01:
    value: 0.25
    note: >-
      RV-Nachhaltigkeitsgesetz; führte den Nachhaltigkeitsfaktor mit Wirkung vom
      1. August 2004 ein.
    reference: § 68 Abs. 4 SGB VI idF Art. 1 G. v. 21.07.2004 BGBl. I S. 1791
