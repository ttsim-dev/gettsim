anteil_bemessungsentgelt_arbeitslosengeld:
  name:
    de: Beitragspflichtiger Anteil des Bemessungsentgelts bei Arbeitslosengeld
    en: Share of the Bemessungsentgelt subject to contributions during Arbeitslosengeld
  description:
    de: >-
      § 166 Abs. 1 Nr. 2 SGB VI. Beitragspflichtige Einnahme bei Bezug von
      Arbeitslosengeld ist dieser Anteil des der Leistung zugrunde liegenden
      Arbeitsentgelts, abzüglich desselben Anteils des beitragspflichtigen
      Arbeitsentgelts aus einer daneben ausgeübten, nicht geringfügigen Beschäftigung.
    en: >-
      § 166 Abs. 1 Nr. 2 SGB VI. While drawing Arbeitslosengeld, this share of the
      Arbeitsentgelt the benefit is based on is subject to pension contributions, minus
      the same share of the contributory wage from a concurrent employment that is not
      geringfügig.
  unit: DIMENSIONLESS
  type: scalar
  1995-01-01:
    reference: § 166 Abs. 1 Nr. 2 SGB VI idF Art. 1 G. v. 18.12.1989 BGBl. I S. 2261
    value: 0.8
    note: >-
      In der Zeit vom 01.01.1992 bis 31.12.1994 waren gemäß § 276 Abs. 1 SGB VI a. F.
      abweichend von § 166 Abs. 1 Nr. 2 SGB VI die gezahlten Sozialleistungen
      beitragspflichtige Einnahmen.
