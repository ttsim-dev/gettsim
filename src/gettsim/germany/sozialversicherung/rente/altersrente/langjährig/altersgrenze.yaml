altersgrenze_vorzeitig:
  name:
    de: >-
      Einheitliche Altersgrenze für vorzeitigen Bezug der Altersrente für langjährig
      Versicherte.
    en: Uniform age threshold for early retirement for long-term employed.
  description:
    de: >-
      Frühestmögliches Alter ab dem die Altersrente für langjährig Versicherte
      bezogen werden kann (mit Abschlägen).
      § 236 SGB VI
      https://www.sozialgesetzbuch-sgb.de/sgbvi/236.html
    en: >-
      Earliest possible age to receive pension for long term insured (with deductions).
      § 236 SGB VI
      https://www.sozialgesetzbuch-sgb.de/sgbvi/236.html
  unit: YEARS
  type: scalar
  1980-01-01:
    reference: § 1248 Abs. 1 RVO idF Art. 1 G. v. 16.10.1972 BGBl. I S. 1965
    note: Entsprechend § 25 Abs. 1 AVG.
    value: 63.0
  1989-12-18:
    reference: § 41 Abs. 2 SGB VI idF Art. 1 G. v. 18.12.1989 BGBl. I S. 2261
    note: >-
      Early retirement age decreased from 63 to 62 starting from birth cohort 1944. See
      `altersgrenze_vorzeitig_gestaffelt`.
  1996-09-27:
    reference: § 41 Abs. 3 SGB VI idF Art. 1 Nr. 10 G. v. 25.09.1996 BGBl. I S. 1461
    note: ERA back to 63. Anlage 21 SGB VI.
    value: 63.0
  1997-12-16:
    reference: § 36 Nr. 1 SGB VI idF Art. 1 G. v. 16.12.1997 BGBl. I S. 2998
    note: >-
      ERA back to 62. Für vor 1948 Geborene blieb es nach § 236 Abs. 1 SGB VI und
      Anlage 21 bei 63 Jahren.
    value: 62.0
  2007-04-20:
    reference:
      - § 36 Satz 2 SGB VI idF Art. 1 G. v. 20.04.2007 BGBl. I S. 554
      - § 236 Abs. 1 Satz 2 SGB VI idF Art. 1 G. v. 20.04.2007 BGBl. I S. 554
    note: ERA back to 63. RV-Altersgrenzenanpassungsgesetz, in Kraft ab 1.1.2008.
    value: 63.0
altersgrenze_vorzeitig_gestaffelt:
  name:
    de: >-
      Gestaffelte Altersgrenze für vorzeitigen Bezug der Altersrente für langjährig
      Versicherte.
    en: Staggered age threshold for early retirement for long-term employed.
  description:
    de: >-
      Frühestmögliches Alter ab dem die Altersrente für langjährig Versicherte
      bezogen werden kann (mit Abschlägen).
      § 236 SGB VI
      https://www.sozialgesetzbuch-sgb.de/sgbvi/236.html
    en: >-
      Earliest possible age to receive pension for long term insured (with deductions).
      § 236 SGB VI
      https://www.sozialgesetzbuch-sgb.de/sgbvi/236.html
  input_unit: CALENDAR_YEAR
  output_unit: YEARS
  type: year_based_phase_inout_of_age_thresholds
  1989-12-18:
    reference: § 41 Abs. 2 SGB VI idF Art. 1 G. v. 18.12.1989 BGBl. I S. 2261
    note: Early retirement age decreased from 63 to 62 starting from birth cohort 1944.
    first_year_to_consider: 1900
    last_year_to_consider: 2100
    1943:
      years: 63
      months: 0
    1944:
      years: 62
      months: 0
  1996-09-27:
    reference: § 41 Abs. 3 SGB VI idF Art. 1 Nr. 10 G. v. 25.09.1996 BGBl. I S. 1461
    note: ERA back to 63. See `altersgrenze_vorzeitig`.
