---
kohorte_abschaffung:
  name:
    de: Kohorte Abschaffung Rente für Frauen
    en: Cohort abolishment pension for women
  description:
    de: >-
      Kohorte, ab der die Rente für Frauen abgeschafft ist.
      https://www.sozialgesetzbuch-sgb.de/sgbvi/237a.html
    en: >-
      Cohort from which pension for women has been abolished
      https://www.sozialgesetzbuch-sgb.de/sgbvi/237a.html
  unit: CALENDAR_YEAR
  type: scalar
  1997-12-16:
    reference: § 237a Abs. 1 Nr. 1 SGB VI idF Art. 1 G. v. 16.12.1997 BGBl. I S. 2998
    note: Rentenreformgesetz 1999.
    value: 1952
  2018-01-01:
    reference: none (all eligible cohorts have reached the Regelaltersgrenze)
    note: Irrelevant because last cohort has passed the normal retirement age.
mindestpflichtbeitragsjahre_ab_alter_40:
  name:
    de: Mindestpflichbeitragsjahre ab 40 für Rente für Frauen
    en: Minimum contribution since 40 pension for women.
  description:
    de: >-
      Mindestpflichbeitragsjahre, nach dem 40. Lebensjahr,
      die für Rente für Frauen berechtigt.
      § 237a SGB VI
      https://www.sozialgesetzbuch-sgb.de/sgbvi/237a.html
    en: >-
      Minimum number of contribution years starting at age 40 required to be eligible
      for pension for women.
      § 237a SGB VI
      https://www.sozialgesetzbuch-sgb.de/sgbvi/237a.html
  unit: YEARS
  type: scalar
  1950-01-01:
    reference: >-
      none (before 1992, § 1248 Abs. 3 RVO required mandatory contributions in most of
      the last 20 years instead)
    value: 10
  1992-01-01:
    reference: § 39 Nr. 2 SGB VI idF Art. 1 G. v. 18.12.1989 BGBl. I S. 2261
    note: >-
      Rentenreformgesetz 1992. Seit dem Rentenreformgesetz 1999 in § 237a Abs. 1 Nr. 3
      SGB VI.
    value: 10
  2018-01-01:
    reference: none (all eligible cohorts have reached the Regelaltersgrenze)
    note: Irrelevant because last cohort has passed the normal retirement age.
