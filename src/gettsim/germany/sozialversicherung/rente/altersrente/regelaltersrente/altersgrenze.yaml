---
altersgrenze:
  name:
    de: Einheitliches Eintrittsalter für Regelaltersrente
    en: Uniform entry age for receiving regelaltersrente - normal retirement age (NRA)
  description:
    de: >-
      § 35 Satz 2 SGB VI
      Regelaltersgrenze ab der Renteneintritt möglich ist. Wenn früher oder später in
      Rente gegangen wird, wird der Zugangsfaktor und damit der Rentenanspruch höher
      oder niedriger, sofern keine Sonderregelungen gelten.
    en: >-
      § 35 Satz 2 SGB VI
      Normal retirement age from which pension can be received. If retirement benefits
      are claimed earlier or later, the Zugangsfaktor and thus the pension entitlement
      is higher or lower unless special regulations apply.
  unit: YEARS
  type: scalar
  1957-02-26:
    reference: >-
      Artikel 1 G. v. 23.02.1957 BGBl. I S. 45 (ArVNG).
      Artikel 1 G. v. 23.02.1957 BGBl. I S. 88 (AnVNG).
    note: >-
      Uniform age limit, enacted the same day by two parallel laws: the ArVNG for
      blue-collar workers (§ 1248 Abs. 1 RVO, BGBl. I S. 45) and the AnVNG for
      white-collar workers (§ 25 Abs. 1 AVG, BGBl. I S. 88). Identical wording in
      both: "Altersruhegeld erhält der Versicherte, der das 65. Lebensjahr vollendet
      hat, wenn die Wartezeit erfüllt ist."
    value: 65.0
  1992-01-01:
    value: 65.0
    reference: Artikel 1 G. v. 18.12.1989 BGBl. I S. 2261 (RRG 1992).
    note: >-
      Recodification into the SGB VI: the age limit moves from § 1248 Abs. 5 RVO
      (blue-collar) and § 25 Abs. 5 AVG (white-collar) into the unified
      § 35 Satz 2 SGB VI. Value unchanged.
  2007-04-19:
    note: >-
      Increase of the early retirement age from 65 to 67 for birth cohort 1947-1964. See
      `altersgrenze_gestaffelt`.
  2031-01-01:
    value: 67.0
    note: Phase-in period is over
altersgrenze_gestaffelt:
  name:
    de: Gestaffeltes Eintrittsalter für Regelaltersrente nach Geburtsjahr
    en: Staggered normal retirement age (NRA) for Regelaltersrente by birth year
  description:
    de: >-
      § 35 Satz 2 SGB VI
      Regelaltersgrenze ab der Renteneintritt möglich ist. Wenn früher oder später in
      Rente gegangen wird, wird der Zugangsfaktor und damit der Rentenanspruch höher
      oder niedriger, sofern keine Sonderregelungen gelten.
    en: >-
      § 35 Satz 2 SGB VI
      Normal retirement age from which pension can be received. If retirement benefits
      are claimed earlier or later, the Zugangsfaktor and thus the pension entitlement
      is higher or lower unless special regulations apply.
  input_unit: CALENDAR_YEAR
  output_unit: YEARS
  type: year_based_phase_inout_of_age_thresholds
  2007-04-20:
    reference: >-
      Artikel 1 G. v. 20.04.2007 BGBl. I S. 554
      (RV-Altersgrenzenanpassungsgesetz).
    note: >-
      Increase of the early retirement age from 65 to 67 for birth cohort 1947-1964.
      Vertrauensschutz (Art. 56) applies for birth cohorts before 1955 who were in
      Altersteilzeit before January 1st, 2007 or received "Anpassungsgeld für
      entlassene Arbeitnehmer des Bergbaus".
    first_year_to_consider: 1900
    last_year_to_consider: 2030
