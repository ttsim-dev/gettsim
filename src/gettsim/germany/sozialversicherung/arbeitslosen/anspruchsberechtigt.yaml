stundengrenze:
  name:
    de: Stundengrenze für Bezug von Arbeitslosengeld
    en: Working hours limit to receive unemployment benefit
  description:
    de: >-
      §138 (3) SGB III, früher auch §102 (2) AFG. Grenze, ab der keine Arbeitslosigkeit
      mehr unterstellt wird.
    en: null
  unit: HOURS_PER_WEEK
  type: scalar
  1969-07-01:
    value: 20
    reference: § 102 Abs. 1 AFG idF G. v. 25.06.1969 BGBl. I S. 582
    note: Arbeitsförderungsgesetz
  1986-01-01:
    value: 19
    reference: § 102 Abs. 1 AFG idF Art. 1 G. v. 20.12.1985 BGBl. I S. 2484
  1989-01-01:
    value: 18
    reference: § 102 Abs. 1 AFG idF Art. 1 G. v. 20.12.1988 BGBl. I S. 2343
  1998-01-01:
    value: 15
    reference:
      - § 118 Abs. 2 Satz 1 SGB III idF Art. 1 G. v. 24.03.1997 BGBl. I S. 594
      - § 8 Abs. 1 Nr. 1 SGB IV idF G. v. 04.11.1982 BGBl. I S. 1450
    note: >-
      Arbeitsförderungs-Reformgesetz. Eine geringfügige Beschäftigung (§ 8 SGB IV:
      regelmäßig weniger als 15 Stunden wöchentlich) schließt
      Beschäftigungslosigkeit nicht aus. Die Entgeltgrenze des § 8 SGB IV ist nicht modelliert.
  2005-01-01:
    value: 15
    reference: § 119 Abs. 3 Satz 1 SGB III idF Art. 1 G. v. 23.12.2003 BGBl. I S. 2848
    note: Drittes Gesetz für moderne Dienstleistungen am Arbeitsmarkt
  2012-04-01:
    value: 15
    reference: § 138 Abs. 3 Satz 1 SGB III idF Art. 2 G. v. 20.12.2011 BGBl. I S. 2854
    note: Gesetz zur Verbesserung der Eingliederungschancen am Arbeitsmarkt
anspruchsdauer_nach_alter:
  name:
    de: Anspruchsdauer für ALG 1 nach Alter.
    en: Period of ALG 1 eligibility based on age.
  description:
    de: >-
      § 147 Abs. 2 SGB III
      Dauer des Anspruchs auf ALG 1 richtet sich nach Alter und wie viele Monate
      eine Person versicherungsplichtig in den letzten 5 Jahren war.
    en: >-
      § 147 Abs. 2 SGB III
      The length of ALG 1 eligibility depends on age and on how many months a
      person was subject to compulsory insurance
  input_unit: YEARS
  output_unit: MONTHS
  type: sparse_to_consecutive_int_lookup_table
