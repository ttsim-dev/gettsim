---
satz_m:
  name:
    de: Maximaler Kinderzuschlagsatz pro Kind
    en: Maximum amount of Kinderzuschlag per child
  description:
    de: § 6a (2) BKGG. Betrag pro Kind
    en: Amount per child.
  unit: EUR_PER_MONTH
  type: scalar
  2005-01-01:
    reference: § 6a Abs. 2 Satz 1 BKGG idF Art. 46 G. v. 24.12.2003 BGBl. I S. 2954
    note: Viertes Gesetz für moderne Dienstleistungen am Arbeitsmarkt (Hartz IV).
    value: 140
  2016-07-01:
    value: 160
    reference: § 6a Abs. 2 Satz 1 BKGG idF Art. 7 G. v. 16.07.2015 BGBl. I S. 1202
    note: >-
      Gesetz zur Anhebung des Grundfreibetrags, des Kinderfreibetrags, des
      Kindergeldes und des Kinderzuschlags.
  2017-01-01:
    reference: § 6a Abs. 2 Satz 1 BKGG idF Art. 12 G. v. 20.12.2016 BGBl. I S. 3000
    note: >-
      Gesetz zur Umsetzung der Änderungen der EU-Amtshilferichtlinie und von weiteren
      Maßnahmen gegen Gewinnkürzungen und -verlagerungen.
    value: 170
  2019-07-01:
    reference:
      - § 20 Abs. 2 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
      - § 20 Abs. 3 BKGG idF Art. 2 G. v. 29.04.2019 BGBl. I S. 530
    note: >-
      Starke-Familien-Gesetz. 185 EUR from 07/2019 to 12/2020, set by § 20 Abs. 2 BKGG
      (2019) and § 20 Abs. 3 BKGG (2020).
    value: 185
  2021-01-01:
    reference:
      - § 6a Abs. 2 Satz 1 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
      - § 6a Abs. 2 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
    note: >-
      By law, from 2021 on, the value is calculated from other parameters
      (Existenzminimumbericht, Kindergeld, previous year's amount).
  2023-01-01:
    reference: § 20 Abs. 3a BKGG idF Art. 6 G. v. 08.12.2022 BGBl. I S. 2230
    note: >-
      Inflationsausgleichsgesetz. Regelung für das Kalenderjahr 2023, abweichend
      von § 6a Absatz 2.
    value: 250
  2024-01-01:
    reference:
      - § 6a Abs. 2 Satz 1 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
      - § 6a Abs. 2 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
      - § 6a Abs. 2 Satz 4 BKGG idF Art. 5 G. v. 23.05.2022 BGBl. I S. 760
    note: Back to formula, including the Kindersofortzuschlag.
satz_vorjahr_ohne_kindersofortzuschlag_m:
  name:
    de: Kinderzuschlagsatz pro Kind im Vorjahr
    en: Maximum amount of Kinderzuschlag per child in the previous year
  description:
    de: § 6a (2) BKGG legt fest, dass der Kinderzuschlag nicht sinken darf
    en: § 6a (2) BKGG sets that the Kinderzuschlag cannot decrease.
  unit: EUR_PER_MONTH
  type: scalar
  2021-01-01:
    reference:
      - § 6a Abs. 2 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
      - § 20 Abs. 3 BKGG idF Art. 2 G. v. 29.04.2019 BGBl. I S. 530
    note: Höchstbetrag 2020 (185 EUR, § 20 Abs. 3 BKGG).
    value: 185
  2022-01-01:
    reference: § 6a Abs. 2 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
    note: Höchstbetrag 2021 = (3780 + 1092 + 216) / 12 - 219 = 205 EUR.
    value: 205
  2023-01-01:
    reference: § 20 Abs. 3a BKGG idF Art. 6 G. v. 08.12.2022 BGBl. I S. 2230
    note: Irrelevant because Kinderzuschlag was set arbitrarily.
  2024-01-01:
    reference:
      - § 6a Abs. 2 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
      - § 20 Abs. 3a BKGG idF Art. 6 G. v. 08.12.2022 BGBl. I S. 2230
    note: Höchstbetrag 2023 (250 EUR, § 20 Abs. 3a BKGG).
    value: 250
  2025-01-01:
    reference: § 6a Abs. 2 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
    value: 272
  2026-01-01:
    reference: § 6a Abs. 2 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
    value: 272
mindesteinkommen:
  name:
    de: Mindesteinkommen für Anspruchsberechtigung
    en: Minimum income to be eligible for Kinderzuschlag
  description:
    de: § 6a (1) Nr. 2 BKGG.
    en: null
  unit: EUR_PER_MONTH_PER_BG
  type: dict
  2008-10-01:
    reference: § 6a Abs. 1 Nr. 2 BKGG idF Art. 1 G. v. 24.09.2008 BGBl. I S. 1854
    single: 600
    paar: 900
entzugsrate_elterneinkommen:
  name:
    de: Minderungsrate durch Einkommen der Eltern über BMG
    en: Transfer withdrawal rate for parent's income
  description:
    de: >-
      § 6a (6) BKGG, bis 01.07.2019 § 6a (4) BKGG. Rate, mit der der
      Gesamtkinderzuschlag nach Erreichen der Bemessungsgrenze durch Einkommen der
      Eltern gemindert wird. Bis 07/2019 wurde das Einkommen nur in 10€-Schritten
      berücksichtigt.
    en: null
  unit: DIMENSIONLESS
  type: scalar
  2005-01-01:
    reference: § 6a Abs. 4 Satz 6 BKGG idF Art. 14a G. v. 30.07.2004 BGBl. I S. 2014
    value: 0.7
  2008-10-01:
    reference: § 6a Abs. 4 Satz 6 BKGG idF Art. 1 G. v. 24.09.2008 BGBl. I S. 1854
    value: 0.5
  2020-01-01:
    reference: § 6a Abs. 6 Satz 3 BKGG idF Art. 2 G. v. 29.04.2019 BGBl. I S. 530
    value: 0.45
entzugsrate_kindeseinkommen:
  name:
    de: Minderungsrate durch Einkommen des Kindes
    en: Rate at which benefit is reduced by child income
  description:
    de: >-
      § 6a (3) BKGG. Einkommen des Kindes beinhaltet auch Unterhalt und
      Unterhaltsvorschuss.
    en: >-
      Child alimony and alimony advance payments are also attributed to the child.
  unit: DIMENSIONLESS
  type: scalar
  2005-01-01:
    reference: § 6a Abs. 3 Satz 1 BKGG idF Art. 46 G. v. 24.12.2003 BGBl. I S. 2954
    value: 1
  2019-07-01:
    reference: § 6a Abs. 3 Satz 3 BKGG idF Art. 1 G. v. 29.04.2019 BGBl. I S. 530
    value: 0.45
parameter_existenzminimum:
