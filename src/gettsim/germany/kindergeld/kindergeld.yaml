altersgrenze:
  name:
    de: Alter, ab dem Kindergeld nicht mehr gezahlt wird.
    en: Age at which child benefit is no longer paid.
  description:
    de: >-
      § 32 Art. 2-4 EStG.
      Für minderjährige Kinder besteht ohne Bedingungen ein Anspruch auf Kindergeld.
      Auch für erwachsene Kinder kann bis zu einer Altersgrenze unter bestimmten
      Bedingungen ein Anspruch auf Kindergeld bestehen.
    en: >-
      § 32 Art. 2-4 EStG.
      Underage children are entitled to child benefit without any conditions. Also adult
      children up to a specified age are entitled to child benefit under certain
      conditions.
  unit: YEARS
  type: dict
  1996-01-01:
    mit_bedingungen: 27
    ohne_bedingungen: 18
    reference:
      - § 32 Abs. 3 EStG idF Art. 1 G. v. 11.10.1995 BGBl. I S. 1250
      - § 32 Abs. 4 Satz 1 Nr. 2 EStG idF Art. 1 G. v. 11.10.1995 BGBl. I S. 1250
    note: >-
      Jahressteuergesetz 1996. Kindergeld is paid under the EStG from 1996 on; GETTSIM
      does not implement Kindergeld eligibility before (previously § 2 BKGG).
  2007-01-01:
    mit_bedingungen: 25
    ohne_bedingungen: 18
    reference:
      - § 32 Abs. 3 EStG idF Art. 1 G. v. 11.10.1995 BGBl. I S. 1250
      - § 32 Abs. 4 Satz 1 Nr. 2 EStG idF Art. 1 G. v. 19.07.2006 BGBl. I S. 1652
    note: >-
      Steueränderungsgesetz 2007. Transitional rule in § 52 Abs. 40 EStG for children
      born in 1981 and 1982 (26 years) not implemented.
