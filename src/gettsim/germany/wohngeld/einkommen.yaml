freibetrag_bei_behinderung_gestaffelt_y:
  name:
    de: Jährlicher Freibetrag pro behindertes Haushaltsmitglied
    en: Annual allowance per disabled household member
  description:
    de: >-
      § 17 (2) WoGG
      Der Betrag ist abhängig vom Behinderungsgrad der jeweiligen Person.
      Bis 1990 gilt ein einheitlicher Freibetrag ab einem Grad der Behinderung von 80;
      die gestaffelten Beträge kommen 1991 hinzu.
    en: null
  input_unit: DIMENSIONLESS
  output_unit: EUR_PER_YEAR
  type: piecewise_constant
  1984-01-01:
    output_unit: DM_PER_YEAR
    reference: § 16 Abs. 3 WoGG idF B. v. 27.12.1982 BGBl. I S. 1921
    intervals:
      - interval: (-inf, 80)
        intercept: 0
      - interval: '[80, inf)'
        intercept: 2400
  1990-10-01:
    reference: § 16 Abs. 2 WoGG idF Art. 1 G. v. 10.08.1990 BGBl. I S. 1522
    intervals:
      - interval: (-inf, 1)
        intercept: 0
      - interval: '[1, 80)'
        intercept: 2400
      - interval: '[80, inf)'
        intercept: 3000
  2002-01-01:
    output_unit: EUR_PER_YEAR
    reference:
      - § 13 Abs. 1 Nr. 1 WoGG idF Art. 17 G. v. 13.09.2001 BGBl. I S. 2376
      - § 13 Abs. 1 Nr. 2 WoGG idF Art. 17 G. v. 13.09.2001 BGBl. I S. 2376
    intervals:
      - interval: (-inf, 1)
        intercept: 0
      - interval: '[1, 80)'
        intercept: 1200
      - interval: '[80, inf)'
        intercept: 1500
  2016-01-01:
    note: Replaced by new rule, see 'freibetrag_bei_behinderung_pauschal_y'
    reference: § 17 Nr. 1 WoGG idF Art. 1 G. v. 02.10.2015 BGBl. I S. 1610
freibetrag_bei_behinderung_pauschal_y:
  name:
    de: Jährlicher Freibetrag pro behindertes Haushaltsmitglied
    en: Annual allowance per disabled household member
  description:
    de: >-
      § 17 Nr. 1 WoGG.
      Für Menschen mit Behinderungsgrad unter 100% muss zusätzlich Pflegebedürftigkeit
      gem. §14 SGB XI. und gleichzeitig Häusliche/teilstationäre/Kurzzeit-Pflege
      vorliegen. Dies ist aktuell nicht implementiert.
    en: null
  unit: EUR_PER_YEAR
  type: scalar
  2016-01-01:
    reference: § 17 Nr. 1 WoGG idF Art. 1 G. v. 02.10.2015 BGBl. I S. 1610
    value: 1500
  2020-01-01:
    reference: § 17 Nr. 1 WoGG idF Art. 1 G. v. 30.11.2019 BGBl. I S. 1877
    value: 1800
anrechnungsfreier_anteil_gesetzliche_rente:
  name:
    de: Anrechnungsfreier Anteil der staatlichen Rente
    en: Share of public pension not subject to transfer withdrawal
  description:
    de: >-
      § 17a WoGG (eingeführt durch Art. 4 Grundrentengesetz v. 12.08.2020,
      BGBl. I S. 1879, mit Wirkung zum 01.01.2021).
      Vom Renteneinkommen abziehbarer Freibetrag für Bezieher einer Rente nach dem
      Sechsten Buch Sozialgesetzbuch mit mindestens 33 Jahren Grundrentenzeiten:
      100 € Sockel zuzüglich 30 % des darüber liegenden Renteneinkommens, gedeckelt
      auf 50 % der Regelbedarfsstufe 1 nach der Anlage zu § 28 SGB XII.
    en: >-
      § 17a WoGG (introduced by Art. 4 Grundrentengesetz v. 12.08.2020, BGBl. I S.
      1879, effective 2021-01-01).
      Allowance deducted from public pension income for recipients of a pension under
      SGB VI with at least 33 years of Grundrentenzeiten: € 100 base plus 30 % of
      pension income above € 100, capped at 50 % of Regelbedarfsstufe 1 (Anlage zu
      § 28 SGB XII).
  input_unit: EUR_PER_MONTH
  output_unit: EUR_PER_MONTH
  type: piecewise_linear
  2021-01-01:
    reference: § 17a Abs. 1 Satz 2 WoGG idF Art. 5 G. v. 12.08.2020 BGBl. I S. 1879
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1
      - interval: '[100, inf)'
        slope: 0.3
