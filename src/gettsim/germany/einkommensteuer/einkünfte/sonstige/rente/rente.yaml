parameter_ertragsanteil:
  name:
    de: >-
      Parameter der Ertragsanteil-Funktion für den Anteil an Renteneinkommen, das
      versteuert werden muss.
    en: >-
      Parameter of the Ertragsanteil-function for the share of pensions subject to
      income taxation that is subject to income tax.
  description:
    de: >-
      Bis 2005 wurden alle Renteneinkommen mit ihrem Ertragsanteil versteuert. Der
      Ertragsanteil bemisst sich nach dem Alter bei Renteneintritt.
    en: >-
      Until 2005, all pension income was taxed with its Ertragsanteil. The Ertragsanteil
      is determined by the age at pension entry.
