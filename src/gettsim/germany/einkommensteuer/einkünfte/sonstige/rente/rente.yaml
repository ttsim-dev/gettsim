parameter_besteuerungsanteil:
  name:
    de: >-
      Parameter der Besteuerungsanteil-Funktion für den Anteil an Renteneinkommen, das
      versteuert werden muss.
    en: >-
      Parameter of the Besteuerungsanteil-function for the share of pensions subject to
      income taxation that is subject to income tax.
  description:
    de: >-
      Renten werden mit dem Besteuerungsanteil besteuert sofern sie nicht aus einer
      staatlich geförderten (d.h. in der Einzahlungsphase steuerlich begünstigten)
      Vorsorgeform stammen.  § 22 Nr. 1 Satz 3 Buchstabe a Doppelbuchstabe aa EStG
    en: >-
      Pensions are taxed with the Besteuerungsanteil unless they come from a
      state-sponsored (i.e. tax-benefited) pension fund.
      § 22 Nr. 1 Satz 3 Buchstabe a Doppelbuchstabe aa EStG
  unit: null
  reference_period: null
