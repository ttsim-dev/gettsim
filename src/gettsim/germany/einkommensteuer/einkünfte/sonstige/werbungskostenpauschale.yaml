---
werbungskostenpauschbetrag:
  name:
    de: Werbungskostenpauschbetrag für sonstige Einkünfte (vor allem Renten).
    en: Lump-sum deduction for miscellaneous income (pensions, most prominently).
  description:
    de: >-
      § 9a Satz 1 Nr. 3 EStG. Pauschbetrag, der von den Einnahmen i.S.d. § 22 Nr. 1, 1a
      und 5 EStG abgezogen wird. Höchstens bis zur Höhe der Einnahmen (§ 9a Satz 2
      EStG).
    en: >-
      § 9a Satz 1 Nr. 3 EStG. Lump-sum deducted from income within the meaning of § 22
      Nr. 1, 1a, and 5 EStG, capped at the income itself (§ 9a Satz 2 EStG).
  unit: EUR_PER_YEAR
  type: scalar
  1984-01-01:
    value: 200
    unit: DM_PER_YEAR
  2002-01-01:
    value: 102
    unit: EUR_PER_YEAR
    reference: Art. 1 G. v. 19.12.2000 BGBl. I S. 1790 (Steuer-Euroglättungsgesetz).
