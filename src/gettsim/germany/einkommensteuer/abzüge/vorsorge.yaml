parameter_altersvorsorgeaufwendungen_regime_bis_2004:
  name:
    de: Vorsorgeaufwendungen nach Rechtslage bis 2004.
    en: Deduction for pension expenses, regime until 2004.
  description:
    de: >-
      Vorwegabzug:
      § 10 (4a) EStG. Früher §10 (3) EStG. Hier steht jeweils der Wert für den
      Steuerpflichtigen. Wird verdoppelt für gemeinsam veranlagte Ehegatten. Der gesamte
      Zeitverlauf wurde bereits 2005 festgelegt.
      Grundhöchstbetrag:
      § 10 (3) EStG.
      Kürzung bei abhängig Beschäftigten:
      §10 (3) S. 2 EStG (vor 2004). Der Vorwegabzug wird pauschal um einen Anteil
      gekürzt bei abhängig Beschäftigten (vereinfacht).
      Achtung: Heterogene Einträge im dict!
    en: null
  type: dict
  1985-01-01:
    reference: § 10 Abs. 3 EStG idF B. v. 12.06.1985 BGBl. I S. 977
    note: >-
      Grundhöchstbetrag nach § 10 Abs. 3 Nr. 1, Vorwegabzug nach § 10 Abs. 3 Nr. 2 EStG.
      Der Vorwegabzug wird um den Arbeitgeberbeitrag zur Rentenversicherung gekürzt; der
      Kürzungsanteil entspricht dem Arbeitgeberanteil am Beitragssatz.
    unit:
      vorwegabzug: DM_PER_YEAR
      grundhöchstbetrag: DM_PER_YEAR
      kürzungsanteil_abhängig_beschäftigte: DIMENSIONLESS
    vorwegabzug: 3000
    grundhöchstbetrag: 2340
    kürzungsanteil_abhängig_beschäftigte: 0.0935
  1986-01-01:
    reference: § 10 Abs. 3 Nr. 2 EStG idF B. v. 12.06.1985 BGBl. I S. 977
    note: >-
      Kürzungsanteil folgt dem Arbeitgeberanteil am Beitragssatz der Rentenversicherung.
    updates_previous: true
    kürzungsanteil_abhängig_beschäftigte: 0.096
  1987-01-01:
    reference: § 10 Abs. 3 Nr. 2 EStG idF B. v. 12.06.1985 BGBl. I S. 977
    note: >-
      Kürzungsanteil folgt dem Arbeitgeberanteil am Beitragssatz der Rentenversicherung.
    updates_previous: true
    kürzungsanteil_abhängig_beschäftigte: 0.0935
  1990-01-01:
    reference: § 10 Abs. 3 Nr. 2 EStG idF Art. 1 G. v. 25.07.1988 BGBl. I S. 1093
    note: >-
      Steuerreformgesetz 1990 (anzuwenden ab VZ 1990, § 52 Abs. 1 EStG).
    updates_previous: true
    vorwegabzug: 4000
    kürzungsanteil_abhängig_beschäftigte: 0.12
  1993-01-01:
