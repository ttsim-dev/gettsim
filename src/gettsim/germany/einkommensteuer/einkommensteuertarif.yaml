---
raw_parameter_einkommensteuertarif:
  name:
    de: Parameter des Einkommensteuertarifs
    en: Parameters of the income tax schedule
  description:
    de: >-
      §32a EStG
      Der quadratische Anstieg in den mittleren Intervallen wird nach der Formel
      des Progressionsfaktors berechnet. Einzelheiten sind im docstring der Funktion
      add_progressionsfaktor beschrieben.
    en: >-
      §32a EStG
      The quadratic rate is calculated by gettsim with the formula of the
      Progressionsfaktor. For details see the docstring of add_progressionsfaktor.
  input_unit: EUR_PER_YEAR
  output_unit: EUR_PER_YEAR
  type: require_converter
