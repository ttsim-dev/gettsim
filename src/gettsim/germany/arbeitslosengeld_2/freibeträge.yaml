abzugsfähige_pauschalen:
  name:
    de: Abzugsfähige Pauschalen für Werbungskosten und Versicherung
    en: Allowance for expenses and insurance
  description:
    de: >-
      § 6 (1) Nr. 3 a) ALG II-V. 2005-01.01 bis 2016-07-31. Betrag mit V. v. 26.07
      .2016 BGBl. I S. 1858 entfallen. Wie entfallen?
      § 3 Alg II-V. Seit 01.01.2008 in § 6 Alg II-V.
    en: null
  unit: EUR_PER_MONTH
  type: dict
  2005-01-01:
    versicherung: 30
    werbung: 15.33
    reference:
      - § 3 Nr. 1 Alg II-V idF V. v. 20.10.2004 BGBl. I S. 2622
      - § 3 Nr. 3 Buchst. a Alg II-V idF V. v. 20.10.2004 BGBl. I S. 2622
  2016-08-01:
    reference: § 6 Abs. 1 Nr. 3 Alg II-V idF Art. 1 V. v. 26.07.2016 BGBl. I S. 1858
    note: >-
      Siebte Verordnung zur Änderung der Arbeitslosengeld II/Sozialgeld-Verordnung. Die
      Pauschale für Werbungskosten entfällt. Die Versicherungspauschale von 30 Euro
      (seit 2008 § 6 Abs. 1 Nr. 1 Alg II-V) gilt weiter; GETTSIM verwendet beide Werte
      nur für die Nettoquote bis September 2005.
parameter_anrechnungsfreies_einkommen_ohne_kinder_in_bg:
  name:
    de: >-
      Parameter der Berechnung des anrechnungsfreien Einkommens wenn keine Kinder in
      Bedarfsgemeinschaft leben
    en: >-
      Parameter for calculation of income not subject to transfer withdrawal when no
      children are in the Bedarfsgemeinschaft
  description:
    de: >-
      Parameter für die Berechnung des anrechnungsfreien Einkommens ohne Kinder in der
      Bedarfsgemeinschaft. § 30 SGB II. Seit 01.10.2005 zudem definiert durch Freibetrag
      in § 11 SGB II, s. § 67 SGB II. Seit 01.04.2011 § 11b (2) SGB II (neugefasst durch
      B. v. 13.05.2011 BGBl. I S. 850. Artikel 2 G. v. 24.03.2011 BGBl. I S. 453).
    en: >-
      Parameter for calculation of income not subject to transfer withdrawal when no
      children are in the Bedarfsgemeinschaft. § 30 SGB II. Since 01.10.2005 also
      defined by exemption in § 11 SGB II, see § 67 SGB II. Since 01.04.2011 § 11b (2)
      SGB II (amended by B. v. 13.05.2011 BGBl. I S. 850. Artikel 2 G. v. 24.03.2011
      BGBl. I S. 453).
  input_unit: EUR_PER_MONTH
  output_unit: EUR_PER_MONTH
  type: piecewise_linear
  2005-01-01:
    reference: § 30 SGB II idF Art. 1 G. v. 24.12.2003 BGBl. I S. 2954
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 400)'
        slope: 0.15
      - interval: '[400, 900)'
        slope: 0.3
      - interval: '[900, 1500)'
        slope: 0.15
      - interval: '[1500, inf)'
        slope: 0
  2005-10-01:
    reference:
      - § 11 Abs. 2 Satz 2 SGB II idF Art. 1 G. v. 14.08.2005 BGBl. I S. 2407
      - § 30 Satz 2 Nr. 1 SGB II idF Art. 1 G. v. 14.08.2005 BGBl. I S. 2407
      - § 30 Satz 2 Nr. 2 SGB II idF Art. 1 G. v. 14.08.2005 BGBl. I S. 2407
    note: Freibetragsneuregelungsgesetz.
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1.0
      - interval: '[100, 800)'
        slope: 0.2
      - interval: '[800, 1200)'
        slope: 0.1
      - interval: '[1200, inf)'
        slope: 0
  2011-04-01:
    reference:
      - § 11b Abs. 2 Satz 1 SGB II idF Art. 2 G. v. 24.03.2011 BGBl. I S. 453
      - § 11b Abs. 3 Satz 2 Nr. 1 SGB II idF Art. 2 G. v. 24.03.2011 BGBl. I S. 453
      - § 11b Abs. 3 Satz 2 Nr. 2 SGB II idF Art. 2 G. v. 24.03.2011 BGBl. I S. 453
    note: >-
      § 11b SGB II gilt seit 1. April 2011 (abweichendes Inkrafttreten der Änderung
      durch Art. 2 G. v. 24.03.2011). Neufassung des SGB II: B. v. 13.5.2011 BGBl. I S.
      850. Art. 5 G. v. 20.12.2011 BGBl. I S.
      2854 hat in § 11b nur Abs. 1 Satz 1 Nr. 8 geändert.
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1.0
      - interval: '[100, 1000)'
        slope: 0.2
      - interval: '[1000, 1200)'
        slope: 0.1
      - interval: '[1200, inf)'
        slope: 0
  2023-01-01:
    reference:
      - § 11b Abs. 2 Satz 1 SGB II idF Art. 1 G. v. 26.07.2016 BGBl. I S. 1824
      - § 11b Abs. 3 Satz 2 Nr. 1 SGB II idF Art. 2 G. v. 02.06.2021 BGBl. I S. 1387
      - § 11b Abs. 3 Satz 2 Nr. 2 SGB II idF Art. 2 G. v. 02.06.2021 BGBl. I S. 1387
    note: Bürgergeld replaces Arbeitslosengeld II.
parameter_anrechnungsfreies_einkommen_mit_kindern_in_bg:
  name:
    de: >-
      Parameter der Berechnung des anrechnungsfreien Einkommens wenn Kinder in der
      Bedarfsgemeinschaft leben
    en: >-
      Parameter for calculation of income not subject to transfer withdrawal when
      children are in the Bedarfsgemeinschaft
  description:
    de: >-
      Obere Einkommensgrenze bei anzurechnendem Einkommen, Intervall 3,
      Bedarfsgemeinschaft mit Kindern. Gilt statt der Parameter in
      parameter_anrechnungsfreies_einkommen_ohne_kinder_in_bg für Leistungsbezieher, die
      mit minderjährigem Kind in BG leben oder die ein minderjähriges Kind haben
      (zweiteres wird aktuell noch nicht im Code beachtet). § 30 SGB II. Seit 01.04.2011
      § 11b SGB II (neugefasst durch B. v. 13.05.2011 BGBl. I S. 850. Artikel 2 G. v.
      24.03.2011 BGBl. I S. 453). Bezieht sich auf die Parameter in
      parameter_anrechnungsfreies_einkommen_ohne_kinder_in_bg.
    en: null
  input_unit: EUR_PER_MONTH
  output_unit: EUR_PER_MONTH
  type: piecewise_linear
  2005-10-01:
    reference:
