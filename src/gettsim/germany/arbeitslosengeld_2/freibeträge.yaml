parameter_anrechnungsfreies_einkommen_ohne_kinder_in_bg:
  name:
    de: >-
      Parameter der Berechnung des anrechnungsfreien Einkommens wenn keine Kinder in
      Bedarfsgemeinschaft leben
    en: >-
      Parameter for calculation of income not subject to transfer withdrawal when no
      children are in the Bedarfsgemeinschaft
  description:
    de: >-
      Parameter für die Berechnung des anrechnungsfreien Einkommens ohne Kinder in der
      Bedarfsgemeinschaft. § 30 SGB II. Seit 01.10.2005 zudem definiert durch Freibetrag
      in § 11 SGB II, s. § 67 SGB II. Seit 01.04.2011 § 11b (2) SGB II (neugefasst durch
      B. v. 13.05.2011 BGBl. I S. 850. Artikel 2 G. v. 24.03.2011 BGBl. I S. 453).
    en: >-
      Parameter for calculation of income not subject to transfer withdrawal when no
      children are in the Bedarfsgemeinschaft. § 30 SGB II. Since 01.10.2005 also
      defined by exemption in § 11 SGB II, see § 67 SGB II. Since 01.04.2011 § 11b (2)
      SGB II (amended by B. v. 13.05.2011 BGBl. I S. 850. Artikel 2 G. v. 24.03.2011
      BGBl. I S. 453).
  unit: Euros
  reference_period: Month
  type: piecewise_linear
  2005-01-01:
    reference: Artikel 1. G. v. 24.12.2003 BGBl. I S. 2954.
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 400)'
        slope: 0.15
      - interval: '[400, 900)'
        slope: 0.3
      - interval: '[900, 1500)'
        slope: 0.15
      - interval: '[1500, inf)'
        slope: 0
  2005-10-01:
    reference: Artikel 1 G. v. 14.08.2005 BGBl. I S. 2407.
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1.0
      - interval: '[100, 800)'
        slope: 0.2
      - interval: '[800, 1200)'
        slope: 0.1
      - interval: '[1200, inf)'
        slope: 0
  2011-04-01:
    reference: Artikel 1 G. v. 20.12.2011 BGBl. I 2854.
    note: >-
      Neufassung des SGB II. B. v. 13.5.2011 BGBl. I S. 850. Artikel 5.
      ToDo: Check these laws -- did they really happen months after the date of the
      policy change?
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1.0
      - interval: '[100, 1000)'
        slope: 0.2
      - interval: '[1000, 1200)'
        slope: 0.1
      - interval: '[1200, inf)'
        slope: 0
  2023-01-01:
    note: Bürgergeld replaces Arbeitslosengeld II.
parameter_anrechnungsfreies_einkommen_mit_kindern_in_bg:
  name:
    de: >-
      Parameter der Berechnung des anrechnungsfreien Einkommens wenn Kinder in der
      Bedarfsgemeinschaft leben
    en: >-
      Parameter for calculation of income not subject to transfer withdrawal when
      children are in the Bedarfsgemeinschaft
  description:
    de: >-
      Obere Einkommensgrenze bei anzurechnendem Einkommen, Intervall 3,
      Bedarfsgemeinschaft mit Kindern. Gilt statt der Parameter in
      parameter_anrechnungsfreies_einkommen_ohne_kinder_in_bg für Leistungsbezieher, die
      mit minderjährigem Kind in BG leben oder die ein minderjähriges Kind haben
      (zweiteres wird aktuell noch nicht im Code beachtet). § 30 SGB II. Seit 01.04.2011
      § 11b SGB II (neugefasst durch B. v. 13.05.2011 BGBl. I S. 850. Artikel 2 G. v.
      24.03.2011 BGBl. I S. 453). Bezieht sich auf die Parameter in
      parameter_anrechnungsfreies_einkommen_ohne_kinder_in_bg.
    en: null
  unit: Euros
  reference_period: Month
  type: piecewise_linear
  2005-10-01:
    reference: Artikel 1 G. v. 14.08.2005 BGBl. I S. 2407.
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1.0
      - interval: '[100, 800)'
        slope: 0.2
      - interval: '[800, 1500)'
        slope: 0.1
      - interval: '[1500, inf)'
        slope: 0
  2011-04-01:
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1.0
      - interval: '[100, 1000)'
        slope: 0.2
      - interval: '[1000, 1500)'
        slope: 0.1
      - interval: '[1500, inf)'
        slope: 0
  2023-01-01:
    note: Bürgergeld replaces Arbeitslosengeld II.
