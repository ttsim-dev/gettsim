---
parameter_vermögensfreibetrag:
  name:
    de: Schonvermögen für Grundsicherung im Alter
    en: Allowed amount of wealth for Grundsicherung im Alter
  description:
    de: >-
      Ab dieser Vermögensschwelle besteht kein Anspruch auf Grundsicherung im Alter /
      bei Erwerbsminderung.
      § 1 Verordnung zur Durchführung des § 90 Abs. 2 Nr. 9 des Zwölften Buches
      Sozialgesetzbuch
    en: >-
      There is no entitlement to Grundsicherung im Alter / bei Erwerbsminderung if
      assets exceed this threshold.
      § 1 Verordnung zur Durchführung des § 90 Abs. 2 Nr. 9 des Zwölften Buches
      Sozialgesetzbuch
  unit: Euros
  reference_period: null
  type: dict
  2003-01-01:
    erwachsene: 2600
    kinder: 0
  2017-04-01:
    erwachsene: 5000
    kinder: 500
  2023-01-01:
    erwachsene: 10000
    kinder: 10000
    reference: Art. 9 G. v. 16.12.2022 BGBl. I S. 2328
    note: Bürgergeld-Gesetz
anrechnungsfreier_anteil_gesetzliche_rente:
  name:
    de: Anrechnungsfreier Anteil der staatlichen Rente (bei mind. 33 Grundrentenzeiten)
    en: >-
      Public pension share not subject to transfer withdrawal (if at least 33
      Grundrentenzeiten)
  description:
    de: >-
      § 82a Abs. 1 und 2 SGB XII
      Anrechnungsfreie Anteile staatliche Rente wenn mindestens 33 Jahre
      Grundrentenzeiten erreicht wurden.
    en: >-
      § 82a Abs. 1 und 2 SGB XII
      Public pension shares not subject to transfer withdrawal for subjects whose
      Grundrentenzeiten exceeds 33 years.
  unit: Share
  reference_period: null
  type: piecewise_linear
  2021-01-01:
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1
      - interval: '[100, inf)'
        slope: 0.3
freibetrag_kapitaleinkünfte:
  name:
    de: Freibetrag des Kapitaleinkommens für Grundsicherung
    en: Amount of capital income not subject to transfer withdrawal
  description:
    de: >-
      § 43 SGB XII Abs. 2
      Nur das Kapitaleinkommens, das über diesem Freibetrag liegt, wird auf die
      Grundsicherung im Alter angerechnet.
    en: >-
      § 43 SGB XII Abs. 2
      Only the capital income above the threshold is considered for the calculation of
      the Grundsicherung im Alter.
  unit: Euros
  reference_period: Year
  type: scalar
  2016-01-01:
    value: 26
anrechnungsfreier_anteil_erwerbseinkünfte:
  name:
    de: Anrechnungsfreier Anteil des Erwerbseinkommens für Grundsicherung
    en: Income shares not subject to transfer withdrawal
  description:
    de: >-
      § 82 SGB XII Abs. 3
      Anteil des Erwerbseinkommens, welcher bei der Berechnung der Grundsicherung nicht
      zum Einkommen addiert wird.
    en: >-
      § 82 SGB XII Abs. 3
      Share of income, which is not added to the total income when calculating the
      Grundsicherung.
  unit: Share
  reference_period: null
  type: scalar
  2005-01-01:
    value: 0.3
anrechnungsfreier_anteil_zusätzliche_altersvorsorge:
  name:
    de: >-
      Anrechnungsfreier Anteil der zusätzlichen Altersvorsorge für Grundsicherung
    en: >-
      Supplementary pension share not subject to transfer withdrawal
  description:
    de: >-
      § 82 Abs. 4, 5 SGB XII (eingeführt durch Art. 2 Nr. 7
      Betriebsrentenstärkungsgesetz v. 17.08.2017, BGBl. I S. 3214).
      Freibetrag für Einkommen aus zusätzlicher Altersvorsorge (betriebliche
      Altersversorgung, Riester-Rente, sonstige freiwillige private Altersvorsorge).
    en: >-
      § 82 Abs. 4, 5 SGB XII (introduced by Art. 2 Nr. 7
      Betriebsrentenstärkungsgesetz v. 17.08.2017, BGBl. I S. 3214).
      Exemption for income from supplementary old-age provision (occupational pensions,
      Riester pensions, other voluntary private pensions).
  unit: Share
  reference_period: null
  type: piecewise_linear
  2018-01-01:
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 1
      - interval: '[100, inf)'
        slope: 0.3
einkommensgrenze_kinder:
  name:
    de: >-
      Gesamteinkommensgrenze der Kinder ersten Grades, ab der Grundsicherungsbezug der
      Eltern ausgeschlossen ist
    en: >-
      Total income threshold of first-degree children, above which parents are excluded
      from receiving Grundsicherung
  description:
    de: >-
      § 43 SGB XII (BGBl. I 2003 S. 3022).
      Erreicht oder übersteigt das jährliche Gesamteinkommen (§ 16 SGB IV) eines Kindes
      diesen Betrag, haben die Eltern keinen Anspruch auf Grundsicherung im Alter.
    en: >-
      § 43 SGB XII (BGBl. I 2003 S. 3022).
      If the annual Gesamteinkommen (§ 16 SGB IV) of any child reaches or exceeds this
      threshold, the parents are excluded from Grundsicherung im Alter.
  unit: Euros
  reference_period: Year
  type: scalar
  2005-01-01:
    value: 100000
    reference: § 43 Abs. 2 SGB XII, BGBl. I 2003 S. 3022
  2020-01-01:
    value: 100000
    reference: Art. 1 Angehörigen-Entlastungsgesetz, BGBl. I 2019 S. 2135
    note: >-
      § 43 Abs. 5 SGB XII wurde aufgehoben. Seither schließt das Einkommen der Kinder
      den Anspruch auf Grundsicherung im Alter nicht mehr aus; die 100.000-Euro-Grenze
      begrenzt nur noch den Unterhaltsrückgriff des Sozialhilfeträgers gegenüber den
      Kindern (§ 94 Abs. 1a SGB XII). Da der Rückgriff in der Praxis üblicherweise
      geltend gemacht wird, in GETTSIM aber nicht modelliert ist, bleibt der Ausschluss
      auch ab 2020 die Standardannahme.
      Siehe https://github.com/ttsim-dev/gettsim/issues/1197
mehrbedarf_bei_schwerbehinderungsgrad_g:
  name:
    de: Mehrbedarf bei Schwerbehinderung
    en: Additional requirement when severely disabled
  description:
    de: >-
      § 30 Abs. 1 SGB XII, https://www.buzer.de/gesetz/3415/al0-3758.htm
      Dieser Anteil des Regelbedarfs wird Menschen mit Schwerbehindertenausweis mit
      Merkzeichen G, die Grundsicherung im Alter oder bei Erwerbsminderung bekommen, als
      Mehrbedarf anerkannt.
    en: >-
      § 30 Abs. 1 SGB XII, https://www.buzer.de/gesetz/3415/al0-3758.htm
      This share of the Regelbedarf is added as for someone who has a severly disabled
      ID card which shows the code 'G' and is entitled to the Grundsicherung.
  unit: Share
  reference_period: null
  type: scalar
  2006-12-07:
    value: 0.17
