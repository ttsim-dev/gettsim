---
parameter_solidaritätszuschlag:
  name:
    de: Solidaritätszuschlag
    en: null
  description:
    de: >-
      Ab 1995, der upper threshold im Intervall 1 ist nach der Formel
      transition_threshold in soli_st.py berechnet.
    en: null
  type: piecewise_linear
  1991-01-01:
    input_unit: DM_PER_YEAR
    output_unit: DM_PER_YEAR
    reference: § 4 Nr. 1 SolZG idF Art. 1 G. v. 24.06.1991 BGBl. I S. 1318
    note: >-
      Solidaritätsgesetz. 7.5 percent for the period from July 1991 to June 1992, i.e.,
      3.75 percent of the annual income tax for 1991 and 1992.
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, inf)'
        slope: 0.0375
  1993-01-01:
    reference: >-
      none (the Solidaritätszuschlaggesetz of 1991 only levied the surcharge for 1991 and
      1992; no surcharge was levied in 1993 and 1994)
    intervals:
      - interval: (-inf, inf)
        slope: 0
        intercept: 0
