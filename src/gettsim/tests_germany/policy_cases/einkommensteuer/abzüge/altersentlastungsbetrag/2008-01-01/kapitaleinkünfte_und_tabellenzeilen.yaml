    completed in 1994), first year of entitlement 1995; table row 2005 (row year
    1995 is outside the table): 40.0 %, at most 1900 Euro; other Einkünfte:
    Einkünfte aus Kapitalvermögen max(2000 - 801, 0) = 1199; 40.0 % x 1199 = 479.60,
    rounded up to 480 -> 480.
    p_id 1 (Kapitalerträge below the allowances): born 15.06.1930 (64th year
