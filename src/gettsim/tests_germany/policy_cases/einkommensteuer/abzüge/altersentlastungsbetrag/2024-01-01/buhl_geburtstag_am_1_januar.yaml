---
info:
  note: |-
    The source gives birth dates, rates and maxima but no income: rental income of
    10 000 Euro is assumed, so the maximum binds.
    p_id 0 ('am 1. Januar 1960 geboren ... Für 2024 steht dir dann erstmals der
    Altersentlastungsbetrag zu'): born 01.01.1960 (1 January: 64th year completed on
    31.12.2023), first year of entitlement 2024; table row 2024: 13.6 %, at most 646
    Euro; other Einkünfte: Vermietung und Verpachtung 10000; 13.6 % x 10000 = 1360,
    at most 646 -> 646.
    p_id 1 ('im Laufe des Jahres 1959 geboren': 13,6 %, at most 646 Euro): born
    15.06.1959 (64th year completed in 2023), first year of entitlement 2024; table
    row 2024: 13.6 %, at most 646 Euro; other Einkünfte: Vermietung und Verpachtung
    10000; 13.6 % x 10000 = 1360, at most 646 -> 646.
    p_id 2 ('am 2. Januar 1960 geboren, bekommt den Entlastungsbetrag erst ab
    2025'): born 02.01.1960 (64th year completed in 2024), first year of entitlement
    2025; 2024 < 2025: not entitled -> 0.
    p_id 3 ('Jahrgang 1958 ... 14 Prozent, aber maximal 665 Euro'): born 15.06.1958
    (64th year completed in 2022), first year of entitlement 2023; table row 2023:
    14.0 %, at most 665 Euro; other Einkünfte: Vermietung und Verpachtung 10000;
    14.0 % x 10000 = 1400, at most 665 -> 665.
  precision_atol: 0.01
  source: >-
    Buhl Data Service (WISO Steuer), 'Altersentlastungsbetrag: Mehr Geld auf dem
    Konto mit 64', https://buhl.de/steuer/ratgeber/altersentlastungsbetrag
