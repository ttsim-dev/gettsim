---
info:
  note: >-
    Benefits under the Progressionsvorbehalt raise the besonderer Steuersatz in both
    branches of the Günstigerprüfung (§ 31 EStG) and thereby the tax relief from the
    Kinderfreibetrag. Persons 0 and 1 have the same income; only person 1 receives
    benefits, which makes the Kinderfreibetrag more favourable than the Kindergeld.
    The Solidaritätszuschlag of person 2 is based on the tax with Kinderfreibetrag at
    the besonderer Steuersatz (§ 3 Abs. 2 SolZG).
  precision_atol: 0.01
  source: Regression test.
