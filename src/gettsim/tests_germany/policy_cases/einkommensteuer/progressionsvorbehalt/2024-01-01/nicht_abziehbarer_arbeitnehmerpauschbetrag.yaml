info:
  note: >-
    Hand-derived from § 32b Abs. 2 Nr. 1 EStG: the Arbeitnehmer-Pauschbetrag
    (§ 9a Satz 1 Nr. 1 Buchst. a EStG, 1.230 € in 2024) is deducted from
    the benefits as far as it was not set against wage income; nothing is
    deducted when actual Werbungskosten above the Pauschbetrag were deducted
    from wages (BFH III R 61/12). The deduction does not turn a positive
    sum negative and does not apply to a negative sum. Single persons with
    5.000 € Arbeitslosengeld (500 € for person 6, -3.000 € for person 7).
