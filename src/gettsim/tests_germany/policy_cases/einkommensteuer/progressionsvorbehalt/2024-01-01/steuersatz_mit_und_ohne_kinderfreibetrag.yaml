info:
  note: >-
    Tariff values from H 32b EStH 2024: Splittingtarif on 50.000 € = 6.046
    € and on 37.000 € = 2.706 €, hence Grundtarif on 25.000 € = 3.023 €
    and on 18.500 € = 1.353 € (§ 32a Abs. 5 EStG). Hand-derived from § 32b
    Abs. 2 EStG: each variant of the z. v. E. gets its own rate. Without
    Kinderfreibetrag: 40.000 € + 10.000 € Arbeitslosengeld, tax 40.000 *
    6.046 / 50.000 = 4.836,80. With Kinderfreibeträge of 13.000 € (assumed):
    27.000 € + 10.000 €, tax 27.000 * 2.706 / 37.000 = 1.974,65.
  precision_atol: 1.0e-06
  source: >-
    https://esth.bundesfinanzministerium.de/esth/2024/A-Einkommensteuergesetz/IV-Tarif-31-34b/Paragraf-32b/inhalt.html
