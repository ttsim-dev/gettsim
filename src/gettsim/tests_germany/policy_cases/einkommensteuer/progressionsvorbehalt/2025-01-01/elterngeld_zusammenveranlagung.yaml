info:
  note: >-
    Inputs and Splittingtarif (8.606 € on 60.000 €) from the Finanzverwaltung
    NRW example. Hand-derived from § 32b Abs. 2 EStG with the unrounded
    rate: 50.000 * 8.606 / 60.000 = 7.171,67, rounded down to 7.171 €, which
    the calculator of the Bayerisches Landesamt für Steuern confirms. The NRW
    page applies a rate rounded to 14,34 % and shows 7.170 €. Assumed: the
    Arbeitnehmer-Pauschbetrag of the wife is used up by wages; no Kinderfreibetrag.
  precision_atol: 1.0e-05
  source: >-
    https://www.finanzamt.nrw.de/en/node/180
