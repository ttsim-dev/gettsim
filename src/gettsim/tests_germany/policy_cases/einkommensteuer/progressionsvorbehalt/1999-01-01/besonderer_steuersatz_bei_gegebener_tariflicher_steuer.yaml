info:
  data_currency: DM
  note: >-
    Hand-derived from § 32b Abs. 2 EStG: the besonderer Steuersatz is the tariff
    tax on the Steuersatzeinkommen divided by the Steuersatzeinkommen. z. v. E.
    30.000 DM, Arbeitslosengeld 10.000 DM, Steuersatzeinkommen 40.000 DM. The
    tariff tax on the Steuersatzeinkommen is an assumed input of 8.000 DM
    because GETTSIM has no tariff before 2002: 8.000 / 40.000 = 0,2. Person 1:
    repayment of 40.000 DM, Steuersatzeinkommen -10.000 DM, rate 0. Amounts in
    DM.
  precision_atol: 1.0e-06
