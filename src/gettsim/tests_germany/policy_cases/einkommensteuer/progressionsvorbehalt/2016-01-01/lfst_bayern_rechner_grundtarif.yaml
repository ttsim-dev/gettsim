    Grundtarif 2016, expected values from the Progressionsvorbehalt calculator of
    the Bayerisches Landesamt für Steuern, which truncates the rate to four decimals
    of a percent and the tax to full Euro. Wages use up the Arbeitnehmer-Pauschbetrag.
    person 0: z. v. E. 20.000 €, krankengeld 5.000 €, Krankengeld raises the rate;
    person 1: z. v. E. 21.500 €, krankengeld -3.000 €, repaid Krankengeld lowers
    the rate; person 2: z. v. E. 5.000 €, arbeitslosengeld 20.000 €, z. v. E. below
    the Grundfreibetrag; person 3: z. v. E. 100.000 €, arbeitslosengeld 20.000 €,
    z. v. E. in the top bracket; person 4: z. v. E. 5.000 €, krankengeld -20.000
    €, negative Steuersatzeinkommen; person 5: z. v. E. 30.000 € ohne and 22.000
    € mit Kinderfreibetrag, arbeitslosengeld 8.000 €.
  precision_atol: 1.0e-06
  source: >-
    https://www.lfst.bayern.de/steuerinfos/steuerberechnung/progressionsvorbehalt-rechner
