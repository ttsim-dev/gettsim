---
info:
  note: >-
    § 14 Abs. 2 Nr. 6 WoGG (Art. 1 G. v. 24.09.2008 BGBl. I S. 1856): the
    Lohn- und Einkommensersatzleistungen nach § 32b Abs. 1 Satz 1 Nr. 1 EStG
    belong to the Jahreseinkommen; § 10 BEEG "bleibt unberührt". No taxes or
    contributions are paid, so the § 16 WoGG deduction is zero (G. v.
    02.10.2015 BGBl. I S. 1610; BMI-Erlass v. 06.04.2020 says the same for
    Kurzarbeitergeld without wages). Person 0 is WoGVwV Nr. 14.21.6 Abs. 4
    (Beispiel): Mutterschaftsgeld 390 €, Elterngeld claim 760 € reduced by it
    to 370 € paid; "wohngeldrechtlich anrechenbar sind ... 460 Euro". GETTSIM
    reaches 460 as 390 + (370 - 300) with `elterngeld__anrechenbarer_betrag_m`
    = 70 supplied (derived; the allowance on Elterngeld alone coincides with
    the shared allowance of the source whenever the paid Elterngeld is at least
    300 €). Person 1: Kurzarbeitergeld 900 € only, income 900 €. Person 2:
    wages after Werbungskosten 2.000 € and repaid Krankengeld 200 €; the node
    is floored at zero, income 2.000 € (hand-derived). Assumed: single birth,
    Basiselterngeld, month entirely after the birth, no employer Zuschuss.
  precision_atol: 0.01
  source: https://dserver.bundestag.de/brd/2017/0284-17.pdf
