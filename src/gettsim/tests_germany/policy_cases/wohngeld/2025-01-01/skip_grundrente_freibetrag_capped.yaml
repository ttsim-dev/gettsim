---
info:
  note: |-
    Single pensioner eligible for Grundrente (420 months of Grundrentenzeiten).
    Tests the § 17a WoGG Grundrentenfreibetrag in the case where the cap binds:
    100 + 0.3 · (1000 - 100) = 370 > 563 / 2 = 281.50 (half of Regelbedarfsstufe 1).
    Created with NRW Wohngeldrechner (Wohnort Bonn, Mietstufe 5) that doesn't check
    for Mindesteinkommen.
    Skipped: GETTSIM does not deduct the Werbungskostenpauschbetrag (§ 9a Satz 1
    Nr. 3 EStG) from pension income in the Wohngeld income calculation yet and
    computes 513 instead of 517. Re-enable once
    https://github.com/ttsim-dev/gettsim/issues/1194 is fixed.
  precision_atol: 0.01
  source: |-
    https://www.wohngeldrechner.nrw.de/wg/wgrbhtml/WGRBWLKM?BULA=NW
