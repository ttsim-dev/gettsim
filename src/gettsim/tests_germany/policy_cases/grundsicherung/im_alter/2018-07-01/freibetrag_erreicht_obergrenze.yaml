info:
  note: |-
    Freibetrag for zusätzliche Altersvorsorge hits the cap (rbs_1 / 2).
    § 82 Abs. 4, 5 SGB XII (Art. 2 Nr. 7 Betriebsrentenstärkungsgesetz
    v. 17.08.2017, BGBl. I S. 3214).
    zusätzliche_altersvorsorge_m = sonstige_private_vorsorge_m
      + geförderte_private_vorsorge_m + betriebliche_altersvorsorge_m
      = 200 + 200 + 200 = 600.
    anrechnungsfreier_anteil_zusätzliche_altersvorsorge(600) = 100 + 0.3 * 500 = 250.
    rbs_1 / 2 = 416 / 2 = 208. min(250, 208) = 208.
    einkommen_aus_zusätzlicher_altersvorsorge_m
      = 600 - 208 + aus_berufsständischen_versicherungen_m
      = 600 - 208 + 100 = 492.
  precision_atol: 0.01
  source: manual calculation
