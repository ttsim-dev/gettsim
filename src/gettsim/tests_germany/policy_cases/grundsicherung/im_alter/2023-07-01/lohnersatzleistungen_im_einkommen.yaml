info:
  note: >-
    Hand-derived from § 82 Abs. 1 Satz 1 SGB XII: "Zum Einkommen gehören alle
    Einkünfte in Geld oder Geldeswert", so Arbeitslosengeld and the other
    wage-replacement benefits count in full next to the pension; Elterngeld
    enters as `elterngeld__anrechenbarer_betrag_m` (existing treatment,
    unchanged). Person 0: gesetzliche Rente 500 + Arbeitslosengeld 100 +
    Krankengeld 300 + Mutterschaftsgeld 200 + anrechenbares Elterngeld 160 =
    1.260 €, no taxes or contributions. Mutterschaftsgeld is counted in full by
    decision although § 82 Abs. 1 Satz 2 Nr. 5 SGB XII (Art. 5 Bürgergeld-Gesetz
    v. 16.12.2022 BGBl. I S. 2328) exempts the § 19 MuSchG part from 01.01.2023.
    Person 1: gesetzliche Rente 800 € and repaid Krankengeld 200 €; the node is
    floored at zero, income 800 € (not 600 €). Earnings, zusätzliche
    Altersvorsorge and capital income are supplied as zero nodes.
  precision_atol: 0.01
