    100 EUR/month in supplementary pension (50 betriebliche + 50 Riester on person 0),
    which is fully covered by the Freibetrag (§ 82 Abs. 4, 5 SGB XII: first 100 EUR
    are exempt). Couple B (persons 2, 3) has no supplementary pension. Both couples
    have the same gesetzliche Rente, so the identical betrag_m_eg demonstrates that
    the Freibetrag fully offsets the supplementary income at the couple level.
