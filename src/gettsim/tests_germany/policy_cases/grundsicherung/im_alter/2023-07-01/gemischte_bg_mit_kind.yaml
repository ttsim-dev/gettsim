    P2 ungedeckter_bedarf = max(0, 568 - 250) = 318 (Kindergeld 250 netted first).
    ungedeckter_bedarf_bg = 969, einkommen_zur_verteilung_bg = 0.
    anspruch_bg = 969 → P0 betrag = 651, P2 betrag = 318.
    SGB XII (Verhältnislösung, Person1):
    gesetzliche Rente 400 – Grundrentenfreibetrag min(190, 502/2) = 190
    → einkommen = 210. bedarf = 651, individueller_restbedarf = 441.
    anspruch_eg = max(0, 651 - 210 - 0) = 441 → GSiA betrag P1 = 441.
  precision_atol: 0.01
  source: Regression test.
