info:
  note: >-
    Hand-derived from § 32b Abs. 1 Satz 1 Nr. 1 EStG as amended by Art. 2 Abs. 6
    Nr. 2 G. v. 05.12.2006 BGBl. I S. 2748 (Elterngeld is Buchst. j from
    01.01.2007). The node without Elterngeld sums Arbeitslosengeld and the seven
    inputs: 1.200 + 100 + 200 + 400 + 500 + 600 + 8.400/12 + 9.600/12 = 4.500 €
    per month; the full catalogue adds Elterngeld 300 € to 4.800 € per month.
    The yearly nodes are twelve times the monthly ones. The yearly inputs are
    multiples of twelve so that the automatic time conversion is exact. The full
    yearly node replaces `einkommensteuer__progressionsvorbehalt__leistungen_y`
    and feeds the Progressionsvorbehalt unchanged: 57.600 € before the
    Arbeitnehmer-Pauschbetrag deduction, which wages use up here.
