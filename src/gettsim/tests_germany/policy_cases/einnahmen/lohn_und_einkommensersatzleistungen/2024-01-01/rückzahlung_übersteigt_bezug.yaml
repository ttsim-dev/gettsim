---
info:
  note: >-
    Hand-derived from § 32b Abs. 1 Satz 1 Nr. 1, Abs. 2 EStG: the inputs are net
    of repayments, and the sum is "vermehrt oder vermindert" (Art. 1 Nr. 30 G.
    v. 11.10.1995 BGBl. I S. 1250), so a repayment that exceeds the receipts
    gives a negative sum that the nodes pass through. Krankengeld 200 € less
    repaid Arbeitslosengeld 700 € = -500 € per month, -6.000 € per year. No
    wages, so the Arbeitnehmer-Pauschbetrag (1.230 €) is not deductible from
    wage income; a negative sum of benefits is not reduced by it (§ 32b Abs. 2
    Nr. 1 EStG), and it lowers the Steuersatzeinkommen in full. The transfer
    consumers floor the node at zero instead; see the Wohngeld, ALG II,
    Bürgergeld, Grundsicherung and Unterhaltsvorschuss cases.
  precision_atol: 0.01
  source: ''
