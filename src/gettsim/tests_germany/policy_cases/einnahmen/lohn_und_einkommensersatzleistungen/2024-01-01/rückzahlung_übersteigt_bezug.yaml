---
info:
  note: >-
    Hand-derived from § 32b Abs. 1 Satz 1 Nr. 1, Abs. 2 EStG: the sum of
    benefits is "vermehrt oder vermindert" (Art. 1 Nr. 30 G. v. 11.10.1995
    BGBl. I S. 1250), so a repayment that exceeds the receipts lowers the
    Steuersatzeinkommen. Krankengeld 200 € per month, 2.400 € per year, less
    repaid Arbeitslosengeld 8.400 € = -6.000 €. No wages, so the
    Arbeitnehmer-Pauschbetrag (1.230 €) is not deductible from wage income; a
    negative net amount is not reduced by it (§ 32b Abs. 2 Nr. 1 EStG). The
    sums of benefits themselves stay at the receipts; the transfers read them
    and never see the repayment.
  precision_atol: 0.01
  source: ''
