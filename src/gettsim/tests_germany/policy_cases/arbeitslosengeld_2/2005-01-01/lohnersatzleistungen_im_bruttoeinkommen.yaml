    BGBl. I S. 2954): "Einnahmen in Geld oder Geldeswert" are income, and no
    exception covers the wage-replacement benefits, so the full § 32b catalogue
    (before 2007 without Elterngeld) enters the gross income. Person 0:
    Arbeitslosengeld 600 + Insolvenzgeld 300 = 900 €, no other income. Person 1:
    wages 800 € and repaid Krankengeld 200 €; a repayment is not a receipt, so
    the node is floored at zero and the gross income is 800 € (not 600 €).
