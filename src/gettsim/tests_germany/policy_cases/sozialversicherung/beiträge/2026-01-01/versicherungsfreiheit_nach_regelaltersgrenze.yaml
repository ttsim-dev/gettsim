---
info:
  note: |-
    Versicherungsfreiheit in der Rentenversicherung nach Erreichen der Regelaltersgrenze
    (§ 5 Abs. 4 Nr. 1 SGB VI). Alle Personen sind 1958 geboren, die Regelaltersgrenze
    liegt damit bei 66 Jahren (792 Monaten), und verdienen 4.000 € im Monat. Der
    Arbeitgeber trägt stets die Hälfte des Beitrags, der bei Versicherungspflicht zu
    zahlen wäre (§ 172 Abs. 1 SGB VI): 4.000 € x 18,6 % / 2 = 372.00 €. Die vollen
    Entgeltpunkte betragen 48.000 € / 51944 € = 0.924072.
    - p_id 0: über der Regelaltersgrenze und Bezug einer Vollrente wegen Alters, also
      versicherungsfrei. Kein Arbeitnehmerbeitrag und keine Entgeltpunkte
      (§ 76b Abs. 4 SGB VI).
    - p_id 1: über der Regelaltersgrenze, aber ohne Rentenbezug.
      § 5 Abs. 4 Nr. 1 SGB VI verlangt den Bezug einer Vollrente, es besteht
      also weiterhin Versicherungspflicht.
    - p_id 2: über der Regelaltersgrenze mit Rentenbezug, aber Verzicht auf die
      Versicherungsfreiheit (§ 5 Abs. 4 S. 2 SGB VI). Beiträge und Entgeltpunkte wie bei
      Versicherungspflicht.
    - p_id 3: genau im Monat, in dem die Regelaltersgrenze erreicht wird. Die
      Versicherungsfreiheit tritt erst nach Ablauf dieses Monats ein.
    - p_id 4: einen Monat später und damit versicherungsfrei.
    - p_id 5 bis 8: wie p_id 0, aber mit Minijob (500 €). Die Versicherungsfreiheit
      wegen Alters geht der Versicherungspflicht im Minijob vor. Verzicht wegen Alters /
      Versicherungspflicht im Minijob: nein/nein, nein/ja, ja/nein, ja/ja.
  precision_atol: 0.000001
  source: Regression test.
