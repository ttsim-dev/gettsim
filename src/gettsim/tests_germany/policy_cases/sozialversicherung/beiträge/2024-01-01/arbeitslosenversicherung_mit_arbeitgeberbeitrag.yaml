  note: |-
    Arbeitgeberbeitrag zur Arbeitslosenversicherung nach Ablauf der Aussetzung. Die
    Person ist 1956 geboren (Regelaltersgrenze 65 Jahre und 10 Monate), 67 Jahre alt,
    bezieht keine Rente und verdient 3.000 € im Monat.
    Die Person ist in der Arbeitslosenversicherung versicherungsfrei
    (§ 28 Abs. 1 Nr. 1 SGB III). Die Aussetzung des Arbeitgeberbeitrags endete mit dem
    31.12.2021 (§ 346 Abs. 3 S. 3 SGB III), sodass der Arbeitgeber wieder die Hälfte des
    Beitrags trägt: 3.000 € x 2,6 % / 2 = 39.00 €. In der
    Rentenversicherung besteht mangels Rentenbezugs Versicherungspflicht:
    3.000 € x 18,6 % / 2 = 279.00 €.
