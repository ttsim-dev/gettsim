info:
  note: |-
    Versicherungsfreier Altersvollrentner mit 1.280 € Monatsentgelt im
    Übergangsbereich. Die reduzierte beitragspflichtige Einnahme beträgt 1202.13 €
    (§ 20 Abs. 2a Satz 1 SGB IV).
    Seit dem 01.10.2022 ergibt sich der Arbeitgeberanteil aus der Anwendung des halben
    Beitragssatzes auf diese reduzierte Einnahme, nicht mehr auf das
    Bruttoarbeitsentgelt: 1202.13 € x 9,3 % = 111.80 € (§ 172 Abs. 1 SGB VI). Für die
    Arbeitslosenversicherung gilt das laut Ziffer 4.3.3.6 des Rundschreibens analog
    (§ 346 Abs. 3 SGB III): 1202.13 € x 1,3 % = 15.63 €.
    Die Quelle weist 1202.13 € und 111.80 € für einen nach § 6 Abs. 1 Satz 1 Nr. 1
    SGB VI befreiten Beschäftigten aus, für den der Arbeitgeber denselben halben
    Beitrag als Zuschuss nach § 172a SGB VI trägt. Der Betrag zur
    Arbeitslosenversicherung ist aus derselben Bemessungsgrundlage abgeleitet, nicht
    der Quelle entnommen.
    Arbeitnehmeranteile entfallen, ebenso entstehen keine Entgeltpunkte
    (§ 76b Abs. 4 SGB VI).
  precision_atol: 0.01
  source: |-
    GKV-Spitzenverband / Deutsche Rentenversicherung Bund / Bundesagentur für Arbeit,
    Rundschreiben "Versicherungs-, beitrags- und melderechtliche Behandlung von
    Beschäftigungsverhältnissen im Übergangsbereich" vom 20.12.2022, Beispiel 12
    (zu Ziffer 4.3.3.6).
