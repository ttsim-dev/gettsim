  note: |-
    Versicherungsfreiheit wegen Alters vor dem Flexirentengesetz und vor Einführung der
    Midijobs. Beide Personen verdienen 2.000 € im Monat. Beitragssatz zur
    Rentenversicherung 2002: 19,1 %, zur Arbeitslosenversicherung: 6,5 %,
    Durchschnittsentgelt 2002: 28626 €.
    - p_id 0: versicherungspflichtig. Rentenversicherung 2.000 € x 19,1 % / 2 =
      191.00 €, Arbeitslosenversicherung 2.000 € x 6,5 % / 2 = 65.00 €, Entgeltpunkte
      24.000 € / 28626 € = 0.838399.
    - p_id 1: 70 Jahre alt und Bezug einer Vollrente wegen Alters. Vor 2017 genügt der
      Rentenbezug in jedem Alter (§ 5 Abs. 4 Nr. 1 SGB VI a. F.). Kein
      Arbeitnehmerbeitrag und keine Entgeltpunkte (§ 76b Abs. 4 SGB VI); der
      Arbeitgeber zahlt unverändert die Hälfte (§ 172 Abs. 1 SGB VI,
      § 346 Abs. 3 SGB III).
