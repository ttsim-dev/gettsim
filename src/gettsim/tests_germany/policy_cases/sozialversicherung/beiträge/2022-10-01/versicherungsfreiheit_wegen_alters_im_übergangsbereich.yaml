info:
  note: |-
    Versicherungsfreiheit wegen Alters im Übergangsbereich. Die Person ist 1955 geboren
    (Regelaltersgrenze 65 Jahre und 9 Monate), über die Regelaltersgrenze hinaus
    beschäftigt, bezieht eine Vollrente wegen Alters und verdient 950 € im Monat.
    Der Arbeitgeber trägt die Hälfte des Beitrags, der bei Versicherungspflicht zu zahlen
    wäre (§ 172 Abs. 1 SGB VI, § 346 Abs. 3 S. 1 SGB III). Die abweichende Beitragslast
    im Übergangsbereich gilt nur für versicherungspflichtig Beschäftigte
    (§ 168 Abs. 1 Nr. 1d SGB VI, § 346 Abs. 1a SGB III) und bleibt hier außer Betracht.
    Maßgeblich ist daher der halbe Gesamtbeitrag auf das Bemessungsentgelt von
    856.39 €: 856.39 € x 18,6 % / 2 = 79.64 € in der
    Rentenversicherung und 856.39 € x 2,4 % / 2 = 10.28 € in der
    Arbeitslosenversicherung.
  precision_atol: 0.01
