---
info:
  note: |-
    Versicherungsfreiheit vor 2017. Bis zum Flexirentengesetz genügte der Bezug einer
    Vollrente wegen Alters in jedem Alter (§ 5 Abs. 4 Nr. 1 SGB VI a. F.); in der
    Arbeitslosenversicherung kam es dagegen schon immer allein auf das Erreichen der
    Regelaltersgrenze an (§ 28 Abs. 1 Nr. 1 SGB III). Die beiden Personen zeigen, dass
    die Voraussetzungen auseinanderfallen.
    - p_id 0: 1944 geboren (Regelaltersgrenze 65 Jahre), über der
      Regelaltersgrenze, aber ohne Rentenbezug, 3.000 € im Monat. In der
      Rentenversicherung besteht Versicherungspflicht:
      3.000 € x 19,9 % / 2 = 298.50 €. In der
      Arbeitslosenversicherung ist die Person versicherungsfrei; der Arbeitgeber trägt
      die Hälfte des Beitrags (§ 346 Abs. 3 S. 1 SGB III):
      3.000 € x 2,8 % / 2 = 42.00 €.
    - p_id 1: 1948 geboren, mit 62 Jahren unter der Regelaltersgrenze, bezieht aber eine
      Vollrente wegen Alters und verdient 1.000 € im Monat. In der Rentenversicherung
      versicherungsfrei, der Arbeitgeber trägt 1.000 € x 19,9 % / 2 = 99.50 €.
      In der Arbeitslosenversicherung besteht weiterhin Versicherungspflicht:
      1.000 € x 2,8 % / 2 = 14.00 €.
  precision_atol: 0.000001
  source: Regression test.
