info:
  note: |-
    Verzicht auf die Versicherungsfreiheit in einer geringfügigen Beschäftigung. Der
    Arbeitgeber trägt in jedem Fall den Pauschalbeitrag von 15 % des Arbeitsentgelts;
    bei Versicherungspflicht trägt der Beschäftigte den Rest, nicht die Hälfte
    (§ 168 Abs. 1 Nr. 1b SGB VI). Beitragspflichtige Einnahme ist mindestens 175 €
    (§ 163 Abs. 8 SGB VI). Ohne Versicherungspflicht entsteht statt voller
    Entgeltpunkte ein Zuschlag im Verhältnis des Arbeitgeberanteils zum vollen Beitrag
    (§ 76b Abs. 1 und 2 SGB VI). Durchschnittsentgelt 2025: 50493 €.

    - p_id 0: 400 € mit Verzicht. Beitrag 400 € x 18,6 % - 400 € x 15 % = 14.40 €,
      Entgeltpunkte 4.800 € / 50493 € = 0.095063.
    - p_id 1: 100 € mit Verzicht. Die Mindestbeitragsbemessungsgrundlage greift:
      175 € x 18,6 % - 100 € x 15 % = 17.55 €, Entgeltpunkte
      2.100 € / 50493 € = 0.041590.
    - p_id 2: 400 € ohne Verzicht. Kein Arbeitnehmerbeitrag, Zuschlag an Entgeltpunkten
      4.800 € x 15 % / (18,6 % x 50493 €) = 0.076663, also 15/18,6 der vollen
      Entgeltpunkte.
  precision_atol: 0.000001
  source: Berechnung nach § 163 Abs. 8, § 168 Abs. 1 Nr. 1b, § 76b SGB VI
