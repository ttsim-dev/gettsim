info:
  note: |-
    Versicherungsfreier Altersvollrentner mit einem Arbeitsentgelt im Übergangsbereich,
    Gegenstück zum Fall von 2020. Monatsentgelt 950 €, reduzierte beitragspflichtige
    Einnahme 815.89 € (§ 20 Abs. 2a SGB IV, festgehalten in
    2025-01-01/einkommen_in_gleitzone.yaml).
    Seit dem 01.10.2022 bemisst sich der Arbeitgeberanteil nach § 172 Abs. 1 SGB VI
    bzw. § 346 Abs. 3 S. 1 SGB III nach dieser reduzierten Einnahme, nicht mehr nach
    dem Bruttoarbeitsentgelt. Der Arbeitgeber trägt also die Hälfte des Gesamtbeitrags
    statt des asymmetrischen Anteils, der für versicherungspflichtige Beschäftigte
    gilt:
    - Rentenversicherung: 815.89 € x 18,6 % / 2 = 75.88 € (statt 101.01 €).
    - Arbeitslosenversicherung: 815.89 € x 2,6 % / 2 = 10.61 € (statt 14.12 €).
    Arbeitnehmeranteile entfallen, ebenso entstehen keine Entgeltpunkte
    (§ 76b Abs. 4 SGB VI).
  precision_atol: 0.02
  source: Regression test for the rule change of 2022-10-01.
