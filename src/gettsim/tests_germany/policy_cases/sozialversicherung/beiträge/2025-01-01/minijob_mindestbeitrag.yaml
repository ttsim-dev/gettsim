---
info:
  note: |-
    Mindestbeitragsbemessungsgrundlage bei geringfügiger Beschäftigung mit
    Versicherungspflicht (§ 163 Abs. 8 SGB VI). Beitragssatz 2025: 18,6 %,
    Mindestbeitragsbemessungsgrundlage 175 €, Mindestbeitrag also
    175 € x 18,6 % = 32.55 €. Der Arbeitgeber zahlt stets 15 % des tatsächlichen
    Verdienstes, der Beschäftigte trägt die Differenz zum vollen Pflichtbeitrag
    (§ 168 Abs. 1 Nr. 1b SGB VI). Entgeltpunkte entstehen auf der
    Mindestbeitragsbemessungsgrundlage: 2.100 € / 50493 € = 0.041590.
    - p_id 0: 150 € Verdienst. Arbeitgeber 22.50 €, Beschäftigter
      32.55 € - 22.50 € = 10.05 €.
    - p_id 1: 25 € Verdienst. Arbeitgeber 3.75 €, Beschäftigter
      32.55 € - 3.75 € = 28.80 €, also mehr als der Verdienst.
  precision_atol: 0.000001
  source: |-
    Minijob-Zentrale, "Rentenversicherungspflicht im Minijob", Beispiele zum
    Mindestbeitrag zur Rentenversicherung.
    https://www.minijob-zentrale.de/DE/die-minijobs/rentenversicherungspflicht
