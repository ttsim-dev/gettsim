---
info:
  note: |-
    Versicherungsfreier Altersvollrentner mit einem Arbeitsentgelt im Übergangsbereich.
    Monatsentgelt 950 €, Beitragssatz 2020: 18,6 %. Die reduzierte beitragspflichtige
    Einnahme beträgt 904.55 €, der Gesamtbeitrag 904.55 € x 18,6 % = 168.25 €.
    Bis zum 30.09.2022 bemisst sich der Arbeitgeberanteil nach § 172 Abs. 1 SGB VI
    nicht nach dieser reduzierten Einnahme, sondern nach dem tatsächlichen
    Bruttoarbeitsentgelt (§ 168 Abs. 1 Nr. 1d SGB VI in der bis dahin geltenden
    Fassung): 950 € x 18,6 % / 2 = 88.35 €. Ein Arbeitnehmeranteil entfällt, ebenso
    entstehen keine Entgeltpunkte (§ 76b Abs. 4 SGB VI).
  precision_atol: 0.01
  source: |-
    Deutsche Rentenversicherung, GRA zu § 172 SGB VI, Beispiel 1 (Höhe der
    Beitragsanteile).
    https://rvrecht.deutsche-rentenversicherung.de/SharedDocs/rvRecht/01_GRA_SGB/06_SGB_VI/pp_0151_175/gra_sgb006_p_0172.html
