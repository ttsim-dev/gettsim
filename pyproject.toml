[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "gettsim"
description = "The German Taxes and Transfers SIMulator"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [
  "Benefits",
  "Economics",
  "Germany",
  "Pensions",
  "Taxes",
  "Transfers",
]
license = { file = "LICENSE" }
maintainers = [
  { name = "Hans-Martin von Gaudecker", email = "hmgaudecker@uni-bonn.de" },
  { name = "Marvin Immesberger" },
]
authors = [
  { name = "Christian Zimpelmann" },
  { name = "Hans-Martin von Gaudecker", email = "hmgaudecker@uni-bonn.de" },
  { name = "Marvin Immesberger" },
]
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  # "ttsim-backend>=1.1.1"
]
urls.Changelog = "https://gettsim.readthedocs.io/en/stable/changes.html"
urls.Documentation = "https://gettsim.readthedocs.io"
urls.Github = "https://github.com/ttsim-dev/gettsim"
urls.Repository = "https://github.com/ttsim-dev/gettsim"
urls.Tracker = "https://github.com/ttsim-dev/gettsim/issues"

[tool.hatch]
build.hooks.vcs.version-file = "src/gettsim/_version.py"
build.targets.sdist.exclude = [ "tests" ]
build.targets.sdist.only-packages = true
build.targets.wheel.only-include = [ "src" ]
build.targets.wheel.sources = [ "src" ]
metadata.allow-direct-references = true
version.source = "vcs"

[tool.ruff]
target-version = "py311"  # Replace by [project] requires-python = ">=3.11" above
fix = true
unsafe-fixes = false
lint.select = [ "ALL" ]
lint.exclude = []
lint.extend-ignore = [
  "COM812",  # Avoid conflicts with ruff-format
  # Ignored during transition phase
  # ======================================
  "D",       # docstrings
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "F722",    # https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error
  "FBT001",  # Boolean-typed positional argument in function definition
  "FBT002",  # Boolean default positional argument in function definition
  "FIX002",  # Line contains TODO -- Use stuff from TD area.
  "ICN001",  # numpy should be np, but different convention here.
  "ISC001",  # Avoid conflicts with ruff-format
  "N999",    # Allow non-ASCII characters in file names.
  "PLC2401", # Allow non-ASCII characters in variable names.
  "PLC2403", # Allow non-ASCII function names for imports.
  "PLR0913", # Allow many arguments in function definitions.
  "PLR5501", # elif not supported by vectorization converter for Jax
  "TRY003",  # Avoid specifying long messages outside the exception class
]
lint.per-file-ignores."conftest.py" = [ "ANN" ]
lint.per-file-ignores."docs/*" = [ "INP001", "T201" ]
lint.per-file-ignores."docs/how_to_guides/modifications_of_policy_environments.ipynb" = [ "E402" ]
lint.per-file-ignores."docs/tutorials/personas.ipynb" = [ "E501" ]
lint.per-file-ignores."src/gettsim/__init__.py" = [
  "PLW0127", # Re-export things for tab-completion explicitly.
  "PT028",   # Cannot have default values in test functions with fixtures -- not an issue here.
]
lint.per-file-ignores."src/gettsim/germany/*" = [ "E501", "E721", "PLR1714", "PLR1716", "RET", "SIM108" ]
lint.per-file-ignores."src/gettsim/germany/familie/familie.py" = [ "PLR2004" ]
lint.per-file-ignores."src/gettsim/germany/lohnsteuer/*.py" = [ "PLR2004" ]
lint.per-file-ignores."src/gettsim/plot/dag/__init__.py" = [
  "PLW0127",
]
lint.per-file-ignores."src/gettsim/tests_germany/**/*.py" = [ "ANN", "S101" ]
lint.per-file-ignores."src/gettsim/typing.py" = [ "F401" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.addopts = [ "--pdbcls=pdbp:Pdb" ]
ini_options.filterwarnings = [
  "ignore:.*XMLParser*:DeprecationWarning",
  "ignore:.*'tree.iter()'*:PendingDeprecationWarning",
  "ignore:.*Sorting*:FutureWarning",
  "ignore:The TerminalReporter.writer attribute is",
  "ignore:Repeated execution of the test suite",
  "ignore:Using or importing the ABCs from 'collections'",
  "ignore:Explicitly requested dtype .*64 requested in zeros_like",
]
ini_options.markers = [
  "wip: Tests that are work-in-progress.",
  "unit: Flag for unit tests which target mainly a single function.",
  "integration: Flag for integration tests which may comprise of multiple unit tests.",
  "end_to_end: Flag for tests that cover the whole program.",
  "skipif_jax: skip test if backend is jax",
  "skipif_numpy: skip test if backend is numpy",
]
ini_options.norecursedirs = [ "docs" ]
ini_options.testpaths = [ "src/gettsim/tests_germany" ]

[tool.ty]
overrides = [ { include = [ "docs/**" ], rules.unresolved-attribute = "ignore" } ]
rules.invalid-return-type = "ignore"
rules.ambiguous-protocol-member = "error"
rules.deprecated = "error"
rules.division-by-zero = "error"
rules.empty-body = "ignore"  # raised for all functions decorated with @policy_input
rules.ignore-comment-unknown-rule = "error"
rules.invalid-argument-type = "error"
rules.invalid-ignore-comment = "error"
rules.possibly-missing-attribute = "error"
rules.possibly-missing-implicit-call = "error"
rules.possibly-missing-import = "error"
rules.possibly-unresolved-reference = "error"
rules.redundant-cast = "error"
rules.undefined-reveal = "error"
rules.unresolved-global = "error"
rules.unsupported-base = "error"
rules.unused-ignore-comment = "error"
rules.useless-overload-body = "error"

[tool.yamlfix]
line_length = 88
sequence_style = "block_style"
none_representation = "null"

[tool.pixi]
dependencies.ipywidgets = "*"
dependencies.jupyterlab = "*"
dependencies.numpy_groupies = "*"
dependencies.numpydoc = "*"
dependencies.openpyxl = "*"
dependencies.pandas = ">=2.3"
dependencies.prek = "*"
dependencies.pygments = "*"
dependencies.pygraphviz = "*"
dependencies.pyyaml = "*"
dependencies.snakeviz = ">=2.2.2"
dependencies.tabulate = "*"
dependencies.toml = "*"
environments.py311 = [ "tests", "py311" ]
environments.py312 = [ "tests", "py312" ]
environments.py313 = [ "tests", "py313" ]
environments.py314 = [ "tests", "py314" ]
environments.py314-jax = [ "py314", "tests", "jax" ]
environments.py314-cuda = [ "py314", "tests", "cuda" ]
environments.py314-metal = [ "py314", "tests", "metal" ]
environments.docs = [ "docs", "py313" ]
feature.cuda.platforms = [ "linux-64" ]
feature.cuda.system-requirements = { cuda = "13" }
feature.cuda.target.linux-64.pypi-dependencies.jax = { version = ">=0.8", extras = [ "cuda13" ] }
feature.cuda.tasks.tests-jax = "pytest --backend=jax"
feature.docs.dependencies.myst-parser = "*"
feature.docs.dependencies.nbsphinx = "*"
feature.docs.dependencies.pydata-sphinx-theme = "*"
feature.docs.dependencies.sphinx = "*"
feature.docs.dependencies.sphinx-automodapi = "*"
feature.docs.dependencies.sphinx-copybutton = "*"
feature.docs.pypi-dependencies.gettsim = { path = ".", editable = true }
feature.docs.pypi-dependencies.gettsim-personas = { git = "https://github.com/ttsim-dev/gettsim-personas.git", branch = "boilerplate" }
feature.docs.pypi-dependencies.ttsim-backend = { git = "https://github.com/ttsim-dev/ttsim.git", branch = "main" }
feature.docs.target.linux-64.tasks.docs = "sphinx-build -T -b html docs docs/_build/html"
feature.docs.target.osx-64.tasks.docs = "dot -c && sphinx-build -T -b html docs docs/_build/html"
feature.docs.target.osx-arm64.tasks.docs = "dot -c && sphinx-build -T -b html docs docs/_build/html"
feature.docs.target.win-64.tasks.docs = "sphinx-build -T -b html docs docs/_build/html"
feature.jax.platforms = [ "linux-64", "osx-arm64", "win-64" ]
feature.jax.pypi-dependencies.jax = ">=0.8"
feature.jax.target.linux-64.tasks.tests-jax = "pytest --backend=jax"
feature.jax.target.osx-arm64.tasks.tests-jax = "dot -c && pytest --backend=jax"  # dot -c needed for pygraphviz on macOS
feature.jax.target.win-64.tasks.tests-jax = "pytest --backend=jax"
feature.metal.platforms = [ "osx-arm64" ]
feature.metal.target.osx-arm64.pypi-dependencies.jax = ">=0.8"
feature.metal.target.osx-arm64.pypi-dependencies.jax-metal = ">=0.1.1"
feature.py311.dependencies.python = "~=3.11.0"
feature.py312.dependencies.python = "~=3.12.0"
feature.py313.dependencies.python = "~=3.13.0"
feature.py314.dependencies.python = "~=3.14.0"
feature.tests.pypi-dependencies.pytest = "*"
feature.tests.pypi-dependencies.pytest-cov = "*"
feature.tests.pypi-dependencies.pytest-profiling = "*"
feature.tests.pypi-dependencies.pytest-xdist = "*"
feature.tests.pypi-dependencies.gettsim-personas = { git = "https://github.com/ttsim-dev/gettsim-personas.git", branch = "main" }
feature.tests.pypi-dependencies.ty = "*"
feature.tests.pypi-dependencies.types-PyYAML = "*"
feature.tests.pypi-dependencies.types-pytz = "*"
feature.tests.target.linux-64.tasks.tests = "pytest"
feature.tests.target.osx-64.tasks.tests = "dot -c && pytest"  # dot -c needed for pygraphviz on macOS
feature.tests.target.osx-arm64.tasks.tests = "dot -c && pytest"  # dot -c needed for pygraphviz on macOS
feature.tests.target.win-64.tasks.tests = "pytest"
feature.tests.tasks.ty = "ty check"
pypi-dependencies.gettsim = { path = ".", editable = true }
pypi-dependencies.ttsim-backend = { git = "https://github.com/ttsim-dev/ttsim.git", branch = "main" }
pypi-dependencies.jaxtyping = ">=0.3.2"
pypi-dependencies.kaleido = ">=1.0.0"
pypi-dependencies.pdbp = ">=1.7.1"
workspace.channels = [ "conda-forge" ]
workspace.platforms = [ "linux-64", "osx-64", "osx-arm64", "win-64" ]
